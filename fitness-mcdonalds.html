<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>麦门信徒的点餐搭子 · 健身达人</title>
<style>
  :root{
    --grass:#7cb342; --grass-dark:#689f38; --dirt:#8d6e63; --dirt-dark:#6d4c41;
    --stone:#9e9e9e; --stone-dark:#757575; --coal:#3e2723;
    --gold:#ffc107; --gold-dark:#e8b04b; --red:#da291c; --red-bright:#ef5350;
    --green:#388e3c; --water:#42a5f5;
    /* 与主站统一的米黄大地暖色调（星露谷像素风） */
    --panel:#faf3df; --panel-light:#f3e6c4; --ink:#2b1506; --text:#5b4632;
    --brown-soft:#8a5a2b; --cream:#fff7e8;
    --px:4px;
  }
  *{margin:0;padding:0;box-sizing:border-box;image-rendering:pixelated;image-rendering:crisp-edges;}
  body{
    font-family:'ZCOOL KuaiLe','PingFang SC','Microsoft YaHei','Courier New',monospace;
    background:
      radial-gradient(circle at 20% 20%, #ffe9b0 0, transparent 40%),
      radial-gradient(circle at 80% 0%, #ffd9d9 0, transparent 45%),
      linear-gradient(160deg,#fff7e8 0%,#ffe3b8 55%,#ffd9c9 100%);
    color:var(--text); min-height:100vh; padding:24px;
    image-rendering:auto;
  }
  .wrap{max-width:1100px;margin:0 auto;}

  header{
    background:var(--ink); border:4px solid #000; box-shadow:0 8px 0 #000;
    padding:20px 28px; display:flex;align-items:center;gap:20px;flex-wrap:wrap;
  }
  .logo{width:64px;height:64px;image-rendering:pixelated;display:block;flex-shrink:0;}
  h1{font-size:30px;color:var(--gold);letter-spacing:2px;text-shadow:3px 3px 0 #000;}
  .sub{font-size:13px;color:#f3d58a;opacity:.9;margin-top:4px;}
  .back-faction-btn{
    background:var(--gold);color:var(--ink);border:3px solid #000;box-shadow:0 4px 0 #000;
    padding:10px 16px;font-family:inherit;font-size:14px;font-weight:bold;letter-spacing:1px;
    cursor:pointer;white-space:nowrap;transition:transform .05s;flex-shrink:0;
  }
  .back-faction-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #000;}
  @media(max-width:600px){
    .back-faction-btn{width:100%;margin-top:10px;}
  }

  /* 人设栏：切换按钮 */
  .hero-bar{
    background:var(--dirt-dark);border:4px solid #000;box-shadow:0 6px 0 #000;
    padding:10px 14px;margin:20px 0;
  }
  .hero-switch-btn{
    display:flex;align-items:center;gap:14px;width:100%;
    background:var(--panel-light);border:3px solid #000;box-shadow:0 4px 0 #000;
    padding:10px 14px;cursor:pointer;font-family:inherit;color:var(--text);
    transition:transform .05s;text-align:left;
  }
  .hero-switch-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #000;}
  #heroFace{width:48px;height:48px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  #heroFace canvas{display:block;}
  #heroFace .no-face{
    width:44px;height:44px;border:3px dashed #8a5a2b;color:#8a5a2b;font-size:20px;
    display:flex;align-items:center;justify-content:center;
  }
  .hero-switch-txt{flex:1;display:flex;flex-direction:column;gap:3px;}
  .hero-switch-lbl{font-size:11px;color:var(--brown-soft);font-weight:bold;letter-spacing:1px;}
  .hero-switch-name{font-size:15px;color:var(--ink);font-weight:bold;}
  .hero-switch-arrow{font-size:13px;color:var(--gold-dark);font-weight:bold;white-space:nowrap;}

  /* 人设选择弹窗 */
  .hero-picker{
    width:100%;max-width:640px;background:var(--panel);border:4px solid #000;
    box-shadow:0 10px 0 #000,0 0 0 4px var(--gold);max-height:88vh;display:flex;flex-direction:column;
  }
  .hero-picker-body{
    padding:16px 18px;overflow-y:auto;flex:1;
    display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;
  }
  .hero-card{
    background:var(--panel-light);border:3px solid #000;box-shadow:0 4px 0 #000;
    padding:14px 10px;text-align:center;cursor:pointer;transition:transform .05s;position:relative;
  }
  .hero-card:active{transform:translateY(3px);box-shadow:0 1px 0 #000;}
  .hero-card.active{outline:3px solid var(--gold);background:#f5e7c8;}
  .hero-card canvas{display:block;margin:0 auto 8px;image-rendering:pixelated;}
  .hero-card .hc-name{font-size:14px;font-weight:bold;color:var(--ink);}
  .hero-card .hc-buff{font-size:11px;color:var(--brown-soft);margin-top:6px;line-height:1.4;}
  .hero-card .hc-check{
    position:absolute;top:-10px;right:-8px;background:var(--gold);color:#000;
    border:2px solid #000;font-size:12px;font-weight:bold;width:22px;height:22px;
    display:none;align-items:center;justify-content:center;box-shadow:2px 2px 0 #000;
  }
  .hero-card.active .hc-check{display:flex;}
  .hero-picker-foot{font-size:11px;color:var(--brown-soft);opacity:.9;text-align:center;padding:10px;border-top:3px dashed var(--panel-light);}

  /* 板块切换 */
  .tabs{display:flex;gap:12px;margin:24px 0;flex-wrap:wrap;}
  .tab{
    flex:1;min-width:220px;padding:16px 20px;cursor:pointer;
    border:4px solid #000;box-shadow:0 6px 0 #000;font-size:20px;font-weight:bold;
    font-family:inherit;letter-spacing:2px;text-align:center;color:#fff;
    transition:transform .05s,box-shadow .05s;
  }
  .tab:active{transform:translateY(4px);box-shadow:0 2px 0 #000;}
  .tab.bulk{background:var(--red);}
  .tab.lean{background:var(--green);}
  .tab.active{outline:4px solid var(--gold);}
  .tab .tag{font-size:12px;display:block;font-weight:normal;opacity:.9;margin-top:2px;}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start;}
  @media(max-width:820px){.grid{grid-template-columns:1fr;}}

  .panel{
    background:var(--panel);border:4px solid #000;box-shadow:0 8px 0 #000;
    padding:18px;margin-bottom:20px;
  }
  .panel h2{
    font-size:18px;color:#c98a4b;border-bottom:3px dashed var(--panel-light);
    padding-bottom:8px;margin-bottom:14px;letter-spacing:1px;
  }

  .cat{margin-bottom:16px;}
  .cat-title{
    display:flex;align-items:center;gap:8px;font-size:15px;color:#6b4f2e;
    margin-bottom:10px;font-weight:bold;
  }
  .cat-title .dot{width:12px;height:12px;display:inline-block;border:2px solid #000;box-shadow:2px 2px 0 #000;}
  .foods{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;}
  .food{
    background:var(--panel-light);border:3px solid #000;box-shadow:0 4px 0 #000;
    padding:10px 6px;text-align:center;cursor:pointer;position:relative;
    transition:transform .05s;
  }
  .food:active{transform:translateY(3px);box-shadow:0 1px 0 #000;}
  .food.selected{outline:3px solid var(--gold);background:#f5e7c8;}
  .food canvas{display:block;margin:0 auto 6px;}
  .food .name{font-size:12px;color:#5b4632;line-height:1.2;}
  .food .stat{font-size:11px;margin-top:3px;}
  .kcal{color:#d0802a;}
  .prot{color:#2e7d32;}
  .badge{
    position:absolute;top:-10px;right:-10px;
    background:#000;color:#fff;border:2px solid #000;
    font-size:12px;font-weight:bold;line-height:1;
    min-width:20px;height:20px;padding:3px 4px;display:none;
    text-align:center;box-shadow:2px 2px 0 rgba(0,0,0,.6);
    image-rendering:pixelated;font-family:'Courier New',monospace;
  }
  .food.selected .badge{display:block;}

  .cart-item{
    display:flex;align-items:center;gap:10px;background:var(--panel-light);
    border:2px solid #000;padding:6px 8px;margin-bottom:8px;
  }
  .cart-item canvas{flex-shrink:0;}
  .cart-item .info{flex:1;font-size:13px;color:#5b4632;}
  .cart-item .info small{color:var(--brown-soft);opacity:.9;}
  .cart-item button{
    background:var(--red-bright);color:#fff;border:2px solid #000;
    width:24px;height:24px;cursor:pointer;font-weight:bold;box-shadow:0 2px 0 #000;
  }
  .cart-total{
    border-top:3px dashed var(--panel-light);margin-top:12px;padding-top:12px;
    font-size:14px;line-height:1.8;color:#5b4632;
  }
  .cart-total .big{font-size:26px;color:#da291c;font-weight:bold;}

  /* ===== 餐盘可视化（已移除，保留列表） ===== */
  .stack-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;}
  .stack-chip{
    display:flex;align-items:center;gap:6px;background:var(--panel-light);border:2px solid #000;
    padding:3px 6px;box-shadow:0 2px 0 #000;animation:pop .25s ease-out;
  }
  .stack-chip canvas{display:block;}
  .stack-chip .nm{font-size:11px;color:#5b4632;}
  .stack-chip .rm{background:var(--red-bright);color:#fff;border:1px solid #000;width:16px;height:16px;
    cursor:pointer;font-weight:bold;line-height:14px;text-align:center;padding:0;}
  @keyframes pop{from{transform:scale(.6);opacity:0;}to{transform:scale(1);opacity:1;}}

  /* ===== 我的世界式选材动画 ===== */
  .food.mc-pop{animation:mcPop .3s steps(3,end);}
  @keyframes mcPop{
    0%{transform:scale(1);filter:none;}
    30%{transform:scale(1.12) rotate(-3deg);}
    60%{transform:scale(.92) rotate(2deg);}
    100%{transform:scale(1);}
  }
  /* 像素粒子 */
  .pixel-particle{
    position:fixed;width:6px;height:6px;pointer-events:none;z-index:200;
    image-rendering:pixelated;background:currentColor;
    animation:fly .6s steps(8,end) forwards;
  }
  @keyframes fly{
    0%{transform:translate(0,0) scale(1);opacity:1;}
    100%{transform:translate(var(--dx),var(--dy)) scale(.4);opacity:0;}
  }
  /* 飞入餐盘的像素方块 */
  .fly-item{
    position:fixed;z-index:201;pointer-events:none;image-rendering:pixelated;
    animation:flyTo .45s cubic-bezier(.2,.8,.3,1) forwards;
  }
  @keyframes flyTo{
    0%{transform:translate(0,0) scale(1);opacity:1;}
    80%{opacity:1;}
    100%{transform:translate(var(--dx),var(--dy)) scale(.5);opacity:.2;}
  }


  .actions{display:flex;gap:10px;margin-top:12px;}
  .btn{
    flex:1;padding:12px;font-family:inherit;font-weight:bold;font-size:15px;
    border:3px solid #000;box-shadow:0 4px 0 #000;cursor:pointer;letter-spacing:1px;
  }
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #000;}
  .btn.gold{background:var(--gold);color:#2b1506;}
  .btn.ghost{background:var(--panel-light);color:#5b4632;}
  .goal-msg{
    margin-top:12px;padding:10px;border:3px solid #000;font-size:13px;display:none;
  }
  .goal-msg.good{background:var(--green);color:#fff;}
  .goal-msg.warn{background:var(--gold-dark);color:#000;}

  /* 套餐 */
  .meal{border:3px solid #000;box-shadow:0 5px 0 #000;background:var(--panel-light);
    padding:12px;margin-bottom:14px;cursor:pointer;position:relative;transition:transform .05s;}
  .meal:active{transform:translateY(3px);box-shadow:0 2px 0 #000;}
  .meal.selected{outline:3px solid var(--gold);}
  .meal h3{font-size:16px;color:#c98a4b;margin-bottom:6px;}
  .meal .rows{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap;}
  .meal canvas{display:block;}
  .meal .desc{font-size:12px;color:#5b4632;opacity:.9;line-height:1.5;}
  .meal .price{position:absolute;top:8px;right:10px;font-size:14px;font-weight:bold;color:#da291c;}
  .meal .tagline{font-size:11px;color:#c98a4b;margin-bottom:4px;}

  .hero-msg{
    margin-top:12px;padding:10px;border:3px solid #000;background:var(--panel-light);
    font-size:13px;line-height:1.6;display:none;color:#5b4632;
  }
  .hero-msg b{color:#c98a4b;}

  .foot{margin-top:20px;text-align:center;font-size:12px;color:var(--text);opacity:.6;}

  /* ===== 结算弹窗 ===== */
  .overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;
    display:none;align-items:center;justify-content:center;padding:20px;
  }
  .overlay.show{display:flex;}
  .checkout{
    width:100%;max-width:460px;background:var(--panel);border:4px solid #000;
    box-shadow:0 10px 0 #000,0 0 0 4px var(--gold);max-height:88vh;display:flex;flex-direction:column;
  }
  .checkout-head{
    background:var(--ink);padding:14px 18px;border-bottom:4px solid #000;
    display:flex;align-items:center;justify-content:space-between;
  }
  .checkout-head h2{color:var(--gold);font-size:18px;letter-spacing:1px;}
  .checkout-head .close{
    background:var(--red-bright);color:#fff;border:2px solid #000;width:28px;height:28px;
    cursor:pointer;font-weight:bold;box-shadow:0 2px 0 #000;font-size:14px;
  }
  .checkout-body{padding:16px 18px;overflow-y:auto;flex:1;}
  .co-row{
    display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed var(--panel-light);
  }
  .co-row canvas{flex-shrink:0;}
  .co-row .n{flex:1;font-size:13px;color:#5b4632;}
  .co-row .n small{color:var(--brown-soft);opacity:.9;display:block;}
  .co-row .q{color:#5b4632;font-size:12px;width:40px;text-align:center;}
  .co-row .p{color:#da291c;font-size:14px;font-weight:bold;white-space:nowrap;}
  .co-summary{margin-top:12px;border-top:3px solid var(--panel-light);padding-top:10px;font-size:14px;line-height:2;}
  .co-summary .row{display:flex;justify-content:space-between;color:#5b4632;}
  .co-summary .row.disc{color:#2e7d32;}
  .co-summary .row.total{border-top:2px solid var(--gold);margin-top:6px;padding-top:6px;color:#5b4632;font-size:18px;font-weight:bold;}
  .co-summary .row.total .amt{color:#da291c;font-size:22px;}
  .co-pay{margin-top:6px;background:var(--gold);color:#2b1506;border:3px solid #000;box-shadow:0 4px 0 #000;
    padding:14px;width:100%;font-family:inherit;font-size:17px;font-weight:bold;letter-spacing:2px;cursor:pointer;}
  .co-pay:active{transform:translateY(3px);box-shadow:0 1px 0 #000;}
  .co-pay:disabled{background:var(--panel-light);color:#a5713a;box-shadow:0 4px 0 #000;cursor:not-allowed;}
  .co-note{font-size:11px;color:var(--brown-soft);opacity:.9;text-align:center;margin-top:10px;}

  /* 支付方式 */
  .pay-methods{margin-top:12px;}
  .pay-methods .lbl{font-size:13px;color:#5b4632;margin-bottom:8px;}
  .pay-opts{display:flex;gap:10px;}
  .pay-opt{
    flex:1;display:flex;align-items:center;gap:8px;justify-content:center;
    padding:10px;background:var(--panel-light);border:3px solid #000;box-shadow:0 3px 0 #000;
    cursor:pointer;font-size:14px;font-weight:bold;color:#5b4632;font-family:inherit;
  }
  .pay-opt:active{transform:translateY(2px);box-shadow:0 1px 0 #000;}
  .pay-opt .ico{width:20px;height:20px;border:2px solid #000;display:inline-block;}
  .pay-opt.wechat .ico{background:#07c160;}
  .pay-opt.alipay .ico{background:#1677ff;}
  .pay-opt.active{outline:3px solid var(--gold);background:#f5e7c8;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <canvas class="logo" id="logoCanvas" width="64" height="64"></canvas>
    <div style="flex:1">
      <h1>麦门信徒的点餐搭子</h1>
      <div class="sub">健身达人 · 像素方块 · 真实麦当劳食材 · 增肌 / 减脂双板块</div>
    </div>
    <button class="back-faction-btn" onclick="goBackToFaction()">↩ 选择派系</button>
  </header>

  <!-- 人设栏：点按钮切换到选择人设界面 -->
  <div class="hero-bar">
    <button class="hero-switch-btn" onclick="openHeroSelect()">
      <span id="heroFace"></span>
      <span class="hero-switch-txt">
        <span class="hero-switch-lbl">🧍 我的点单伙伴</span>
        <span class="hero-switch-name" id="heroName">还没选人设，点我选一个 →</span>
      </span>
      <span class="hero-switch-arrow">换人设 ▸</span>
    </button>
  </div>

  <div class="tabs">
    <div class="tab bulk active" id="tabBulk" onclick="switchMode('bulk')">
      增肌模式 <span class="tag">高蛋白 · 高碳水 · 热量盈余</span>
    </div>
    <div class="tab lean" id="tabLean" onclick="switchMode('lean')">
      减脂模式 <span class="tag">低卡 · 高蛋白 · 热量缺口</span>
    </div>
  </div>

  <div class="grid">
    <div>
      <div class="panel">
        <h2>🍔 真实麦当劳食材 DIY（点击添加）</h2>
        <div id="foodArea"></div>
      </div>
    </div>

    <div>
      <div class="panel">
        <h2>🛒 我的餐盘</h2>
        <div class="hero-msg" id="heroMsg"></div>
        <div class="stack-list" id="cartList"></div>
        <div class="cart-total" id="cartTotal"></div>
        <div class="goal-msg" id="goalMsg"></div>
        <div class="actions">
          <button class="btn gold" onclick="clearCart()">清空</button>
          <button class="btn ghost" onclick="openCheckout()">下单</button>
        </div>
      </div>

      <div class="panel">
        <h2>📦 麦当劳套餐参考（点击一键加入）</h2>
        <div id="mealArea"></div>
      </div>
    </div>
  </div>

  <div class="foot">麦门永存 ★ 麦麦陪你好好吃饭 · 食材数据参考麦当劳官网营养信息 · 像素画为原创方块绘制</div>
</div>

<!-- 人设选择弹窗 -->
<div class="overlay" id="heroOverlay">
  <div class="hero-picker">
    <div class="checkout-head">
      <h2>🧍 今天，选谁当点单伙伴？</h2>
      <button class="close" onclick="closeHeroSelect()">×</button>
    </div>
    <div class="hero-picker-body" id="heroPickerBody"></div>
    <div class="hero-picker-foot">选中后自动切换 · 不同伙伴有不同点单 buff</div>
  </div>
</div>

<!-- 结算弹窗 -->
<div class="overlay" id="checkoutOverlay">
  <div class="checkout">
    <div class="checkout-head">
      <h2>💳 结算</h2>
      <button class="close" onclick="closeCheckout()">×</button>
    </div>
    <div class="checkout-body" id="checkoutBody"></div>
    <div class="co-note">本页面为概念演示，不含真实支付</div>
  </div>
</div>

<script>
/* ========== 像素画引擎 ========== */
function P(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function px(cv,map){
  const ctx=cv.getContext('2d');
  for(const [color,cells] of Object.entries(map)){
    ctx.fillStyle=color;
    for(const [x,y] of cells){ctx.fillRect(x,y,1,1);}
  }
}
function line(x0,y0,x1,y1){const c=[];const dx=Math.abs(x1-x0),dy=Math.abs(y1-y0);
  let x=x0,y=y0;const sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx-dy;
  while(true){c.push([x,y]);if(x===x1&&y===y1)break;const e2=2*e;
    if(e2>-dy){e-=dy;x+=sx;}if(e2<dx){e+=dx;y+=sy;}}return c;}
function rect(x0,y0,x1,y1){const c=[];for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)c.push([x,y]);return c;}
function circle(cx,cy,r){const c=[];for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++){if(x*x+y*y<=r*r+2)c.push([cx+x,cy+y]);}return c;}

const SCALE=4;

/* ========== 麦当劳真实食材 ==========
   营养成分参考麦当劳官网营养计算器（单份 kcal / 蛋白质 g） */
const foods={
  // 面包 & 主食（麦当劳标准面包、薯条、早餐等）
  carb:[
    {id:'bun',name:'芝麻面包',kcal:164,prot:5.9,colors:{'#f0c069':rect(1,2,10,10),'#e0a94f':rect(1,2,10,5),'#fff':[[3,2],[6,2],[9,2],[4,3],[7,3]]}},
    {id:'fries_m',name:'中薯条',kcal:337,prot:4.2,colors:{'#ffc107':[[3,3],[6,3],[9,3],[3,6],[6,6],[9,6],[4,9],[7,9]]}},
    {id:'fries_s',name:'小薯条',kcal:230,prot:2.9,colors:{'#ffb300':[[4,4],[7,4],[4,7],[7,7],[5,9]]}},

function drawHero(h,scale){
  const cv=P(16,16);
  const m={};
  // 头
  m[h.skin]=rect(3,1,12,6);
  // 眼睛/表情
  if(h.id==='creeper'){m['#000']=rect(4,3,5,3).concat(rect(10,3,11,3)).concat([[6,5],[9,5],[7,6],[8,6]]);}
  else if(h.id==='enderman'){m['#d500f9']=rect(5,3,6,4).concat(rect(9,3,10,4));}
  else if(h.id==='zombie'){m['#000']=rect(5,3,6,4).concat(rect(9,3,10,4));m['#1b5e20']=rect(5,4,6,4).concat(rect(9,4,10,4));}
  else if(h.id==='skeleton'){m['#000']=rect(5,3,6,4).concat(rect(9,3,10,4));}
  else if(h.id==='villager'){m['#000']=rect(5,3,6,4).concat(rect(9,3,10,4));m['#6d4c41']=rect(4,5,11,5);}
  else if(h.id==='iron'){m['#5d4037']=rect(5,3,6,3).concat(rect(9,3,10,3));}
  else if(h.id==='pig'){m['#000']=rect(5,3,6,3).concat(rect(9,3,10,3));m['#e07888']=rect(3,1,3,2).concat(rect(10,1,12,2));}
  else{m['#000']=rect(5,3,6,3).concat(rect(9,3,10,3));m['#4a2f1f']=rect(4,1,11,2);}
  // 身体
  m[h.shirt]=rect(3,7,12,12);
  if(h.id==='steve'){m['#1f6f9f']=rect(3,7,12,12);}
  // 手臂
  const arm=h.id==='creeper'?'#4caf50':h.id==='zombie'?'#2e7d32':h.id==='skeleton'?'#bcaaa4':h.id==='iron'?'#8a8a8a':h.shirt;
  m[arm]=rect(1,7,2,12).concat(rect(13,7,14,12));
  // 腿
  const leg=h.id==='zombie'?'#1b5e20':h.id==='skeleton'?'#bcaaa4':h.id==='iron'?'#8a8a8a':'#3a5a78';
  m[leg]=rect(4,13,6,15).concat(rect(9,13,11,15));
  const cv2=P(16,16);
  px(cv2,m);
  const sz=(scale||44);
  cv2.style.width=sz+'px';cv2.style.height=sz+'px';cv2.style.imageRendering='pixelated';
  return cv2;
}

/* ========== 我的世界式选材动画 ========== */
function mcPickupAnim(foodEl, f){
  // 1. 食物卡片方块式弹跳
  foodEl.classList.remove('mc-pop');
  void foodEl.offsetWidth;
  foodEl.classList.add('mc-pop');

  // 2. 像素粒子爆裂（颜色取食材主色）
  const colors=Object.keys(f.colors);
  const mainColor=colors[0]||'#ffd54f';
  const rect=foodEl.getBoundingClientRect();
  const cx=rect.left+rect.width/2, cy=rect.top+rect.height/2;
  for(let i=0;i<16;i++){
    const p=document.createElement('span');
    p.className='pixel-particle';
    p.style.color=colors[i%colors.length]||mainColor;
    p.style.left=cx+'px';
    p.style.top=cy+'px';
    const ang=Math.random()*Math.PI*2;
    const dist=18+Math.random()*36;
    p.style.setProperty('--dx',Math.cos(ang)*dist+'px');
    p.style.setProperty('--dy',Math.sin(ang)*dist+'px');
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),650);
  }

  // 3. 一个像素方块飞入「我的餐盘」区域
  const cartEl=document.getElementById('cartList');
  const target=cartEl.getBoundingClientRect();
  const fly=document.createElement('canvas');
  fly.width=12;fly.height=12;
  fly.style.width='20px';fly.style.height='20px';
  fly.style.position='fixed';
  fly.style.left=(cx-10)+'px';
  fly.style.top=(cy-10)+'px';
  const fctx=fly.getContext('2d');
  px(fly,f.colors);
  document.body.appendChild(fly);
  fly.className='fly-item';
  fly.style.setProperty('--dx',(target.left+10-cx)+'px');
  fly.style.setProperty('--dy',(target.top+10-cy)+'px');
  setTimeout(()=>fly.remove(),480);
}

function renderCart(){
  const list=document.getElementById('cartList');
  const total=document.getElementById('cartTotal');
  const msg=document.getElementById('goalMsg');

  list.innerHTML='';
  if(cart.length===0){
    list.innerHTML='<div style="font-size:13px;opacity:.6;padding:10px 0;">餐盘空空如也，点左边的真实食材开始 DIY 吧～</div>';
    total.innerHTML='';
    msg.style.display='none';
    return;
  }
  let kcal=0,prot=0;
  cart.forEach((id,i)=>{
    const f=foodById[id];
    kcal+=f.kcal;prot+=f.prot;
    const chip=document.createElement('div');
    chip.className='stack-chip';
    chip.appendChild(drawFood(f,2));
    const nm=document.createElement('span');nm.className='nm';nm.textContent=f.name;
    chip.appendChild(nm);
    const rm=document.createElement('button');rm.className='rm';rm.textContent='×';rm.onclick=()=>removeItem(i);
    chip.appendChild(rm);
    list.appendChild(chip);
  });
  total.innerHTML=`共 ${cart.length} 件<br>热量 <span class="big">${kcal}</span> kcal · 蛋白质 <span class="big">${prot.toFixed(1)}</span> g`;
  msg.style.display='block';
  const target=mode==='bulk'?{kcal:900,prot:55}:{kcal:400,prot:35};
  if(mode==='bulk'){
    if(kcal>=target.kcal&&prot>=target.prot){msg.className='goal-msg good';msg.textContent='💪 达标！热量与蛋白质满足增肌需求，练完开吃！';}
    else{msg.className='goal-msg warn';msg.textContent=`⚠️ 距离增肌目标还差 ${Math.max(0,target.kcal-kcal)} kcal / ${Math.max(0,target.prot-prot.toFixed(0))}g 蛋白质`;}
  }else{
    if(kcal<=target.kcal&&prot>=target.prot){msg.className='goal-msg good';msg.textContent='🥗 达标！低卡高蛋白，减脂无负担～';}
    else if(kcal>target.kcal){msg.className='goal-msg warn';msg.textContent=`⚠️ 热量超了 ${kcal-target.kcal} kcal，减脂期建议控制在 ${target.kcal} kcal 内`;}
    else{msg.className='goal-msg warn';msg.textContent=`⚠️ 蛋白质还差 ${(target.prot-prot.toFixed(0))}g，可加点板烧鸡腿排/牛肉饼`;}
  }
}

    const box=document.createElement('div');
    box.className='meal';
    box.innerHTML=`<div class="price">${meal.price}</div><h3>${meal.name}</h3><div class="tagline">${meal.tag}</div>`;
    const rows=document.createElement('div');rows.className='rows';
    meal.items.forEach(id=>rows.appendChild(drawFood(foodById[id],2.5)));
    box.appendChild(rows);
    const desc=document.createElement('div');desc.className='desc';desc.textContent=meal.desc;
    box.appendChild(desc);
    box.onclick=()=>{
      cart=cart.concat(meal.items);
      renderCart();
      updateFoodBadges();
      if(hero&&hero.id==='villager'){toast('村民：绿宝石结账，本单九折！💎');}
      else{toast('已加入套餐：'+meal.name);}
    };
    area.appendChild(box);
  });
}

function switchMode(m){
  mode=m;
  document.getElementById('tabBulk').classList.toggle('active',m==='bulk');
  document.getElementById('tabLean').classList.toggle('active',m==='lean');
  renderMeals();
  renderCart();
}

function toast(text){
  const t=document.createElement('div');
  t.textContent=text;
  t.style.cssText='position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#000;color:#ffd54f;padding:12px 20px;border:3px solid #ffd54f;font-weight:bold;z-index:99;box-shadow:0 4px 0 #ffb300;letter-spacing:1px;max-width:80%;text-align:center;';
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),1800);
}

/* ========== 结算页 ========== */
function openCheckout(){
  if(cart.length===0){toast('餐盘还是空的，先点餐吧～');return;}
  renderCheckout();
  document.getElementById('checkoutOverlay').classList.add('show');
}
function closeCheckout(){
  document.getElementById('checkoutOverlay').classList.remove('show');
}
function renderCheckout(){
  const body=document.getElementById('checkoutBody');
  body.innerHTML='';

  // 汇总每件商品数量
  const counts={};
  cart.forEach(id=>{counts[id]=(counts[id]||0)+1;});

  let subtotal=0;
  let totalKcal=0;
  let totalProt=0;
  const ids=Object.keys(counts);
  ids.forEach(id=>{
    const f=foodById[id];
    const q=counts[id];
    const price=foodPrice(id);
    const lineTotal=price*q;
    subtotal+=lineTotal;
    totalKcal+=f.kcal*q;
    totalProt+=f.prot*q;
    const row=document.createElement('div');
    row.className='co-row';
    row.appendChild(drawFood(f,2.5));
    const n=document.createElement('div');n.className='n';
    n.innerHTML=`${f.name}<small>${f.kcal}kcal · 蛋白 ${f.prot}g</small>`;
    row.appendChild(n);
    const qd=document.createElement('div');qd.className='q';qd.textContent='×'+q;
    row.appendChild(qd);
    const pd=document.createElement('div');pd.className='p';pd.textContent='¥'+lineTotal.toFixed(0);
    row.appendChild(pd);
    body.appendChild(row);
  });

  // 优惠：村民九折
  let discount=0;
  if(hero&&hero.id==='villager'){discount=Math.round(subtotal*0.1);}

  const total=subtotal-discount;

  const sum=document.createElement('div');
  sum.className='co-summary';
  let html=`<div class="row"><span>小计（${cart.length} 件）</span><span>¥${subtotal.toFixed(0)}</span></div>`;
  html+=`<div class="row"><span>🔥 卡路里总额</span><span>${totalKcal} kcal</span></div>`;
  html+=`<div class="row"><span>💪 蛋白质总额</span><span>${totalProt.toFixed(1)} g</span></div>`;
  if(discount>0){
    html+=`<div class="row disc"><span>村民绿宝石优惠 -10%</span><span>-¥${discount}</span></div>`;
  }
  html+=`<div class="row total"><span>应付金额</span><span class="amt">¥${total.toFixed(0)}</span></div>`;
  sum.innerHTML=html;
  body.appendChild(sum);

  // 支付方式选择
  const pm=document.createElement('div');
  pm.className='pay-methods';
  let payMethod=null;
  function renderPayOpts(){
    pm.innerHTML='';
    const lbl=document.createElement('div');lbl.className='lbl';lbl.textContent='选择支付方式：';
    pm.appendChild(lbl);
    const opts=document.createElement('div');opts.className='pay-opts';
    [['wechat','微信'],['alipay','支付宝']].forEach(([key,name])=>{
      const o=document.createElement('div');
      o.className='pay-opt '+key+(payMethod===key?' active':'');
      const ico=document.createElement('span');ico.className='ico';
      o.appendChild(ico);
      o.appendChild(document.createTextNode(name));
      o.onclick=()=>{payMethod=key;renderPayOpts();};
      opts.appendChild(o);
    });
    pm.appendChild(opts);
  }
  renderPayOpts();
  body.appendChild(pm);

  const pay=document.createElement('button');
  pay.className='co-pay';
  pay.textContent='确认支付 ¥'+total.toFixed(0);
  pay.onclick=()=>{
    if(!payMethod){toast('请先选择微信或支付宝支付');return;}
    pay.disabled=true;
    pay.textContent='支付中…';
    setTimeout(()=>{
      closeCheckout();
      toast((payMethod==='wechat'?'微信':'支付宝')+'支付成功！取餐号 #'+(Math.floor(Math.random()*900)+100)+' 🍔');
      clearCart();
    },900);
  };
  body.appendChild(pay);
}
