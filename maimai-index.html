<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>麦门信徒的点餐搭子</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<!-- 云服务 SDK（单文件 HTML 用 CDN 形式） -->
<script src="https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js"></script>
<style>
@font-face {
  font-family: 'Zpix';
  src: url('https://cdn.jsdelivr.net/gh/SolidZORO/zpix-pixel-font@master/dist/Zpix.ttf') format('truetype');
  font-display: swap;
}
/* ============ 星露谷像素风 · 配色体系 ============
   低饱和暖木质感：奶油黄 / 草绿 / 深棕 / 陶土红 / 木棕 */
:root{
  /* 星露谷主色板 */
  --gold:#e8b04b;        /* 麦穗金，替代高饱和黄 */
  --gold-deep:#c9923a;
  --red:#b5482f;         /* 陶土红，替代亮红 */
  --red-deep:#93402a;
  --brown:#3a2b1e;       /* 深木棕描边 */
  --brown-soft:#5b4530;
  --cream:#f3e6c4;       /* 奶油底，替代冷白 */
  --cream-light:#faf3df;
  --wood:#c9923a;        /* 木棕 */
  --wood-deep:#a5713a;
  --wood-soft:#e7d3a8;
  --grass:#6aa84f;       /* 星露谷草绿 */
  --grass-deep:#4f7f3a;
  --earth:#c98a4b; --earth-deep:#a5713a; --earth-soft:#f5e7c8; --earth-cream:#f3e6c4;
  --fitness:#6aa84f; --food:#d08a2e; --mood:#c96a8c; --blind:#7d6bb0;
  --green:#6aa84f; --orange:#d08a2e; --pink:#c96a8c; --purple:#7d6bb0;
  --px:3px solid var(--brown);
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:'ZCOOL KuaiLe','Zpix','Press Start 2P','Microsoft YaHei',monospace;
  background:
    radial-gradient(circle at 18% 18%, #f3e6c4 0, transparent 45%),
    radial-gradient(circle at 82% 6%, #e7d3a8 0, transparent 42%),
    linear-gradient(165deg,#f3e6c4 0%,#e7d3a8 55%,#dcc69a 100%);
  color:var(--brown);
  min-height:100vh;
  image-rendering:pixelated;
  overflow-x:hidden;
}
/* 星露谷草地纹理：底部渐隐 + 细碎像素点 */
body::before{
  content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
  background-image:
    linear-gradient(rgba(58,43,30,.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(58,43,30,.045) 1px, transparent 1px);
  background-size:20px 20px;
}

/* ---------- generic pixel components（星露谷立体像素块） ---------- */
.px{
  background:linear-gradient(180deg,#faf3df,#f3e6c4);
  border:var(--px); box-shadow:0 4px 0 var(--brown), inset 0 2px 0 rgba(255,255,255,.6), inset 0 -2px 0 rgba(58,43,30,.15);
  border-radius:6px;
}
.px-gold{background:linear-gradient(180deg,#f3d58a,#e8b04b);}
.px-red{background:linear-gradient(180deg,#d27058,#b5482f); color:#fff;}
.px-green{background:linear-gradient(180deg,#8fc06f,#6aa84f); color:#fff;}
.px-earth{background:linear-gradient(180deg,#e7c694,#c98a4b); color:#fff;}
.px-pink{background:linear-gradient(180deg,#d68fa8,#c96a8c); color:#fff;}
.px-purple{background:linear-gradient(180deg,#a796d0,#7d6bb0); color:#fff;}
.btn{
  display:inline-block; cursor:pointer; border:var(--px); box-shadow:0 3px 0 var(--brown), inset 0 2px 0 rgba(255,255,255,.55);
  padding:10px 16px; font:inherit; font-size:13px; color:var(--brown);
  background:linear-gradient(180deg,#faf3df,#e7d3a8); user-select:none; transition:none; letter-spacing:1px; border-radius:4px;
}
.btn:hover{background:linear-gradient(180deg,#fffdf2,#eeddb4);}
.btn:active{transform:translateY(3px); box-shadow:0 0 0 var(--brown), inset 0 2px 0 rgba(255,255,255,.4);}
.btn:disabled{opacity:.5; cursor:not-allowed;}
.btn-sm{padding:6px 10px; font-size:11px; box-shadow:0 2px 0 var(--brown), inset 0 2px 0 rgba(255,255,255,.5);}
.btn-sm:active{transform:translateY(2px); box-shadow:0 0 0 var(--brown);}
.btn.gold{background:linear-gradient(180deg,#f3d58a,#e8b04b);}
.btn.red{background:linear-gradient(180deg,#d27058,#b5482f); color:#fff;}
.tag{display:inline-block; font-size:10px; padding:2px 6px; border:2px solid var(--brown); background:var(--cream-light); border-radius:2px;}
.title-px{
  font-family:'Press Start 2P','ZCOOL KuaiLe','PingFang SC','Microsoft YaHei',sans-serif; letter-spacing:0;
  text-shadow:none; word-break:break-word; line-height:1.6;
}
.chinese{font-family:'ZCOOL KuaiLe','PingFang SC','Hiragino Sans GB','Microsoft YaHei','微软雅黑',sans-serif;}

/* ========== v4: 静态全景图 + 局部微动元件（禁止整图放大，防止模糊） ========== */
#bgScene{position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; background:#2b2013;}
#bgSceneImg{
  position:absolute; left:50%; top:0; height:100%; width:auto; min-width:100%;
  transform:translateX(-50%); object-fit:cover; object-position:center 20%;
  image-rendering:pixelated; image-rendering:crisp-edges;
}
/* 不加全局暗色蒙版，保留背景本身柔和色彩；仅面板自带底色保证文字可读 */
/* 背景保持完全静态（用户要求，不做任何动效） */
/* 背景轻纱：极淡奶白，让背景不抢 UI（非暗色蒙版） */
#bgScene::after{content:''; position:absolute; inset:0; background:rgba(250,243,223,.16);}
/* 角落像素装饰（固定视口角落，不抢内容） */
#questDecor{position:fixed; inset:0; z-index:5; pointer-events:none;}
#questDecor .earth-lamp{position:fixed; top:18px; left:22px;}
#questDecor .earth-bag{position:fixed; bottom:26px; left:30px; font-size:22px;}
#questDecor .earth-bench{position:fixed; bottom:22px; right:30px;}
@media(max-width:760px){#questDecor{display:none;}}

/* 像素加载动画：飘落像素树叶 */
#leafLoader{position:fixed; inset:0; z-index:500; background:rgba(58,43,30,.55); display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px; transition:opacity .4s;}
#leafLoader.done{opacity:0; pointer-events:none;}
#leafLoader .leaf-box{width:80px;height:80px; position:relative;}
#leafLoader .leaf-box span{position:absolute; top:-12px; font-size:16px; animation:leafFall 2.4s linear infinite;}
#leafLoader .leaf-box span:nth-child(1){left:8px; animation-delay:0s;}
#leafLoader .leaf-box span:nth-child(2){left:30px; animation-delay:.8s;}
#leafLoader .leaf-box span:nth-child(3){left:52px; animation-delay:1.6s;}
@keyframes leafFall{0%{transform:translateY(0) rotate(0); opacity:0;}15%{opacity:1;}100%{transform:translateY(84px) rotate(180deg); opacity:0;}}
#leafLoader .leaf-txt{color:#f6ecd2; font-size:13px; letter-spacing:2px;}

/* 城市选择卡片 */
.city-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px; max-width:860px; margin:0 auto; width:100%;}
@media(max-width:560px){.city-grid{grid-template-columns:1fr;}}
.city-card{
  cursor:pointer; padding:0; overflow:hidden; text-align:left; position:relative;
  background:rgba(250,243,223,.72);
  border:4px solid var(--brown); border-radius:8px; box-shadow:0 5px 0 var(--brown), inset 0 2px 0 rgba(255,255,255,.6);
  transition:transform .15s, box-shadow .15s;
}
.city-card:hover{transform:translateY(-4px); box-shadow:0 9px 0 var(--brown), inset 0 2px 0 rgba(255,255,255,.6);}
.city-card.selected{outline:4px solid var(--gold); outline-offset:2px;}
.city-card .cc-head{padding:16px 16px 10px; display:flex; align-items:baseline; gap:10px;}
.city-card .cc-head h3{font-size:20px; color:var(--brown);}
.city-card .cc-head .en{font-family:'Press Start 2P',monospace; font-size:9px; color:var(--brown-soft);}
.city-card .cc-scene{height:150px; margin:0 12px 12px; border:3px solid var(--brown); border-radius:5px; position:relative; overflow:hidden; background:#3a2b1e;}
.city-card .cc-scene video{width:100%; height:100%; object-fit:cover; object-position:center 18%; background:#3a2b1e;}

.city-card .cc-foot{padding:0 16px 14px; font-size:12px; color:var(--brown-soft); line-height:1.7;}

/* 单人/多人 像素场景卡 */
.scene-card{
  cursor:pointer; padding:22px 16px 18px; text-align:center; position:relative;
  background:rgba(250,243,223,.72);
  border:4px solid var(--brown); border-radius:8px; box-shadow:0 5px 0 var(--brown), inset 0 2px 0 rgba(255,255,255,.6);
  transition:transform .15s, box-shadow .15s, border-color .15s;
}
.scene-card:hover{transform:translateY(-5px); border-color:var(--gold); box-shadow:0 10px 0 var(--brown), 0 0 14px rgba(232,176,75,.45), inset 0 2px 0 rgba(255,255,255,.6);}
.scene-card.flash{animation:pxFlash .3s steps(2);}
@keyframes pxFlash{0%{filter:brightness(1);}50%{filter:brightness(1.5);}100%{filter:brightness(1);}}
.scene-card .sc-stage{height:96px; display:flex; align-items:flex-end; justify-content:center; gap:6px; font-size:34px; margin-bottom:14px; line-height:1;}
.scene-card .sc-stage .seat{animation:seatBob 2.6s ease-in-out infinite;}
.scene-card .sc-stage .seat:nth-child(2){animation-delay:.4s;}
.scene-card .sc-stage .seat:nth-child(3){animation-delay:.8s;}
@keyframes seatBob{0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);}}
.scene-card h3{font-size:18px; margin-bottom:8px; color:var(--brown);}
.scene-card p{font-size:12px; color:var(--brown-soft); line-height:1.8;}
.scene-card .sc-tag{display:inline-block; margin-top:10px; font-size:10px; padding:3px 10px; border:2px solid var(--brown); border-radius:3px; background:var(--cream-light); color:var(--brown-soft);}

/* 底部像素结算栏 */
/* 底部订单导航条：折叠=预算进度条；展开=订单明细 */
#bottomBar{
  position:fixed; left:50%; bottom:14px; transform:translateX(-50%); z-index:120;
  width:min(720px, 94vw); display:none; flex-direction:column;
  background:rgba(244,230,200,.97);
  border:3px solid var(--brown); border-radius:12px;
  box-shadow:0 5px 0 rgba(58,43,30,.3), inset 0 2px 0 rgba(255,255,255,.5);
  padding:10px 14px; max-height:72vh; overflow-y:auto;
}
#bottomBar.show{display:flex;}
#bottomBar .bb-bar-row{display:flex; align-items:center; gap:10px; cursor:pointer; user-select:none;}
#bottomBar .bb-title{font-size:12px; font-weight:bold; color:var(--brown);}
#bottomBar .bb-total{font-family:'Press Start 2P',monospace; font-size:13px; color:var(--brown);}
#bottomBar .bb-arrow{margin-left:auto; font-size:11px; color:var(--brown-soft); white-space:nowrap;}
#bottomBar .bb-progress{margin-top:8px;}
#bottomBar .bb-track{height:14px; border:2px solid var(--brown); background:#e6d3a8; border-radius:7px; overflow:hidden;}
#bottomBar .bb-fill{height:100%; background:repeating-linear-gradient(45deg,#f2c14e 0 8px,#e7b644 8px 16px); transition:width .3s steps(6);}
#bottomBar .bb-ptext{font-size:10px; color:var(--brown-soft); margin-top:4px; display:flex; justify-content:space-between;}
#bottomBar .bb-detail{display:none; margin-top:10px; border-top:2px dashed #c9a97a; padding-top:10px;}
#bottomBar.open .bb-detail{display:block;}
#bottomBar .bb-list{max-height:200px; overflow:auto; display:flex; flex-direction:column;}
#bottomBar .bb-actions{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px;}
#bottomBar .bb-actions .btn{flex:1; min-width:110px; font-size:11px;}

/* 顶部城市小木牌 + 返回木牌 */
.wood-sign{
  display:inline-flex; align-items:center; gap:6px; font-size:11px; color:var(--brown);
  background:linear-gradient(180deg,#e0c090,#c9a06a); border:3px solid var(--brown); border-radius:4px;
  padding:4px 10px; box-shadow:0 3px 0 var(--brown); cursor:pointer; user-select:none;
}
.wood-sign:hover{transform:translateY(-2px); box-shadow:0 5px 0 var(--brown);}
.wood-sign.static{cursor:default;}
.wood-sign.static:hover{transform:none; box-shadow:0 3px 0 var(--brown);}
.store-list{display:flex; flex-direction:column; gap:12px; max-width:560px; width:100%; margin:0 auto;}
.store-card{
  display:flex; align-items:center; gap:12px; padding:14px 16px;
  background:rgba(240,226,192,.62);
  border:3px solid var(--brown); border-radius:8px; box-shadow:0 4px 0 var(--brown), inset 0 2px 0 rgba(255,255,255,.5);
  transition:transform .12s, border-color .12s;
}
.store-card:hover{transform:translateY(-3px); border-color:var(--gold);}
.store-card.selected{outline:3px solid var(--gold); outline-offset:2px;}
.store-card .st-main{flex:1; min-width:0;}
.store-card .st-name{font-size:14px; color:var(--brown); font-weight:bold; line-height:1.5;}
.store-card .st-closed{font-size:10px; color:#9a8260; border:2px solid #b39a72; border-radius:3px; padding:1px 6px; margin-left:6px; font-weight:normal;}
.store-card .st-addr{font-size:11px; color:var(--brown-soft); margin-top:5px; line-height:1.6;}
.store-card .st-meta{font-size:11px; color:var(--brown-soft); margin-top:4px;}
.store-card .st-meta b{font-family:'Press Start 2P',monospace; font-size:9px;}
.store-card .st-go{flex:0 0 auto;}
@media(max-width:560px){.store-card{flex-direction:column; align-items:stretch;} .store-card .st-go{width:100%;}}
/* ---- UI 面板居中（不放右边），半透明像素木框；背景全景从面板四周露出 ---- */
#app{
  position:relative; z-index:20;
  max-width:1080px; margin:28px auto 120px;
  padding:26px 24px;
  background:rgba(244,230,200,.95);
  border:3px solid #5b4530; border-radius:16px;
  box-shadow:0 8px 0 rgba(58,43,30,.28), inset 0 2px 0 rgba(255,255,255,.5);
}
@media(max-width:760px){
  #app{margin:12px 10px 20px; padding:14px;}
}
.group-decor{position:fixed; bottom:86px; left:14px; z-index:60; font-size:20px; opacity:.85; display:flex; flex-direction:column; gap:4px; pointer-events:none;}
.group-decor span{animation:seatBob 2.8s ease-in-out infinite;}
.group-decor span:nth-child(2){animation-delay:.5s;}
.group-decor span:nth-child(3){animation-delay:1s;}


/* ---------- 欢迎页 & 用餐人数选择 ---------- */
.welcome{display:flex; flex-direction:column; align-items:center; text-align:center; padding:50px 20px 30px;}
.welcome .mc-logo{
  width:96px;height:96px; border-radius:22px; background:linear-gradient(180deg,#d27058,#b5482f);
  border:4px solid var(--brown); box-shadow:0 5px 0 var(--brown), inset 0 3px 0 rgba(255,255,255,.25);
  display:flex; align-items:center; justify-content:center;
  font-family:'Press Start 2P',monospace; font-size:48px; color:var(--gold);
  text-shadow:3px 3px 0 var(--brown); margin-bottom:26px;
  position:relative;
}
.welcome .mc-logo::after{content:''; position:absolute; bottom:-13px; left:50%; transform:translateX(-50%); width:0;height:0; border-left:13px solid transparent; border-right:13px solid transparent; border-top:13px solid var(--red); filter:drop-shadow(0 3px 0 var(--brown));}
.welcome .w-title{font-size:26px; letter-spacing:1px; margin-bottom:14px; color:var(--brown);}
.welcome .w-sub{font-size:14px; color:var(--brown-soft); line-height:1.9; margin-bottom:30px; max-width:460px;}
.welcome .w-tagline{font-size:13px; color:var(--brown-soft); background:#f6ecd2; border:3px solid var(--brown); border-radius:4px; padding:10px 16px; margin-bottom:34px; box-shadow:0 3px 0 rgba(58,43,30,.15);}
.welcome .w-start{font-size:18px; padding:14px 40px;}
.mode-grid{display:grid; grid-template-columns:1fr 1fr; gap:18px; max-width:620px; margin:0 auto; width:100%;}
@media(max-width:560px){.mode-grid{grid-template-columns:1fr;}}
.mode-card{
  cursor:pointer; padding:26px 18px; text-align:center;
  background:linear-gradient(180deg,#faf3df,#f0e2c0);
  border:3px solid var(--brown); box-shadow:0 4px 0 var(--brown), inset 0 2px 0 rgba(255,255,255,.6); border-radius:6px;
  transition:transform .12s;
}
.mode-card:hover{transform:translateY(-3px); box-shadow:0 7px 0 var(--brown), inset 0 2px 0 rgba(255,255,255,.6);}
.mode-card .mode-emoji{font-size:44px; margin-bottom:12px;}
.mode-card h3{font-size:18px; margin-bottom:8px;}
.mode-card p{font-size:12px; color:var(--brown-soft); line-height:1.7;}

/* ---------- header ---------- */
header.px{
  display:flex; align-items:center; gap:16px; padding:14px 18px; flex-wrap:wrap;
  background:linear-gradient(180deg,#faf3df,#f0e2c0);
}
.logo-mark{
  width:46px;height:46px; background:var(--red); border:3px solid var(--brown);
  box-shadow:0 3px 0 var(--brown), inset 0 2px 0 rgba(255,255,255,.25); border-radius:50%; position:relative; flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;color:var(--gold);
  font-size:22px; text-shadow:2px 2px 0 var(--brown);
}
.brand{flex:1; min-width:200px;}
.brand h1{font-size:16px; line-height:1.5;}
.brand .sub{font-size:11px; color:var(--brown-soft); margin-top:4px; letter-spacing:2px;}
.faction-pill{display:flex; align-items:center; gap:8px; font-size:12px;}
.faction-pill canvas{image-rendering:pixelated; border:2px solid var(--brown); background:var(--cream-light); border-radius:3px;}

/* ---------- tabs ---------- */
nav.tabs{display:flex; gap:0; margin:18px 0 14px; flex-wrap:wrap;}
nav.tabs .btn{flex:1; min-width:130px; text-align:center; border-right:none; }
nav.tabs .btn:last-child{border-right:var(--px);}
nav.tabs .btn.active{background:linear-gradient(180deg,#d27058,#b5482f); color:#fff;}
.subtabs{display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap;}
.subtabs .btn.active{background:linear-gradient(180deg,#f3d58a,#e8b04b);}

/* ---------- layout ---------- */
.grid{display:grid; gap:16px;}
.cols-2{grid-template-columns:1fr 1fr;}
.cols-menu{grid-template-columns:1.15fr .85fr;}
@media(max-width:820px){.cols-2,.cols-menu{grid-template-columns:1fr;}}
.card{padding:16px;}
.card h2{font-size:14px; margin-bottom:12px; display:flex; align-items:center; gap:8px;}
.card h2 .bar{width:6px;height:18px;background:var(--red);box-shadow:2px 2px 0 rgba(58,43,30,.2);}

/* ---------- faction select screen ---------- */
.fs-title{text-align:center; margin:20px 0 6px; font-size:24px; color:var(--brown);}
.fs-sub{text-align:center; font-size:12px; color:var(--brown-soft); margin-bottom:24px; letter-spacing:2px;}
.fs-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px;}
@media(max-width:900px){.fs-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:480px){.fs-grid{grid-template-columns:1fr;}}
.faction-card{
  cursor:pointer; padding:18px 14px; text-align:center; position:relative;
  transition:transform .12s;
}
.faction-card:hover{transform:translateY(-3px);}
.faction-card.selected{outline:4px solid var(--red); outline-offset:2px;}
.faction-card canvas{image-rendering:pixelated; width:96px;height:96px; border:3px solid var(--brown); background:var(--cream-light); border-radius:4px; box-shadow:0 4px 0 rgba(58,43,30,.2);}
.faction-card h3{font-size:14px; margin:12px 0 4px;}
.faction-card .fc-sub{font-size:11px; color:var(--brown-soft); margin-bottom:8px;}
.faction-card .tags{display:flex; flex-wrap:wrap; gap:4px; justify-content:center; margin-top:8px;}
.faction-card .start{margin-top:14px; font-size:11px; opacity:.9;}

/* ---------- menu / cart ---------- */
.menu-filters{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px;}
.menu-list{max-height:460px; overflow:auto; display:flex; flex-direction:column; gap:8px; padding-right:4px;}
.menu-item{display:flex; align-items:center; gap:10px; padding:9px 10px; border:3px solid var(--brown); background:linear-gradient(180deg,#faf3df,#f3e6c4); box-shadow:0 3px 0 rgba(58,43,30,.18), inset 0 2px 0 rgba(255,255,255,.5); border-radius:4px; cursor:pointer; transition:transform .08s, box-shadow .08s, background .12s; position:relative;}
.menu-item:hover{transform:translateY(-2px);}
.menu-item.added{background:linear-gradient(180deg,#f7eccd,#f0dfb0); border-color:var(--red); box-shadow:0 0 0 2px var(--gold), 0 3px 0 rgba(58,43,30,.18);}
.menu-item .mi-count{
  flex:0 0 auto; background:var(--red); color:#fff; font-size:11px; font-weight:bold;
  padding:2px 8px; border-radius:10px; border:2px solid var(--brown);
}
/* 点击已点特效：金色光圈脉冲 */
@keyframes popAdded{0%{box-shadow:0 0 0 0 rgba(232,176,75,.9);}100%{box-shadow:0 0 0 12px rgba(232,176,75,0);}}
.menu-item.pop{animation:popAdded .5s ease-out;}
.menu-item .mi-info{flex:1; min-width:0;}

/* ========== 欢迎页 · 16bit CRT 游戏启动首页（纯 CSS 像素画） ========== */
#app.welcome-mode{

}
.crt-scene{
  position:fixed; inset:0; z-index:20; overflow:hidden;
  display:flex; align-items:center; justify-content:center;
}
/* ---- 黄昏像素天空：橙紫晚霞，低对比柔和 ---- */
.px-sky{position:absolute; inset:0;
  background:linear-gradient(180deg,
    #7a6398 0%, #9b6fa0 22%, #c97f8e 44%, #e8956d 62%, #f0b07a 78%, #f2c98f 100%);}
/* ---- 像素云（块状分明） ---- */
.px-cloud{position:absolute; opacity:.85;}
.px-cloud i{position:absolute; width:14px; height:8px; background:#f6e0c8; image-rendering:pixelated;}
.px-cloud i:nth-child(1){left:0; top:8px;} .px-cloud i:nth-child(2){left:14px; top:8px;}
.px-cloud i:nth-child(3){left:28px; top:8px;} .px-cloud i:nth-child(4){left:14px; top:0;}
.px-cloud i:nth-child(5){left:28px; top:0;} .px-cloud i:nth-child(6){left:42px; top:8px;}
.px-cloud i:nth-child(7){left:7px; top:16px;} .px-cloud i:nth-child(8){left:21px; top:16px;} .px-cloud i:nth-child(9){left:35px; top:16px;}
.px-cloud.dark i{background:#e6b898;}
/* ---- 城市天际线（像素楼群 + 广州塔） ---- */
.px-skyline{position:absolute; left:0; right:0; bottom:0; height:34vh; min-height:180px;
  display:flex; align-items:flex-end; justify-content:center; gap:10px; padding:0 4vw;}

  clip-path:polygon(28% 0, 72% 0, 100% 100%, 0 100%);}

/* ---- CRT 老电视 ---- */
.crt-tv{
  position:relative; z-index:5; width:min(680px, 92vw);

.earth-lamp .lamp-shade{width:34px;height:16px; background:#a5713a; border:3px solid var(--brown); border-radius:3px; position:relative;}
.earth-lamp .lamp-shade::after{content:''; position:absolute; bottom:-8px; left:50%; transform:translateX(-50%); width:8px;height:8px; background:#f3d58a; border:2px solid var(--brown); animation:lampGlow 2.2s ease-in-out infinite;}
.earth-lamp .lamp-pole{width:6px;height:26px; background:#8a5a2b; border:2px solid var(--brown);}
.earth-lamp .lamp-base{width:26px;height:8px; background:#6b4f2e; border:2px solid var(--brown); border-radius:2px;}
@keyframes lampGlow{0%,100%{box-shadow:0 0 2px #f3d58a;opacity:.55;}50%{box-shadow:0 0 12px 4px #f3d58a;opacity:1;}}
/* 街边长椅 */
.earth-bench{position:absolute; bottom:10px; right:14px; z-index:5; display:flex; flex-direction:column; align-items:center;}
.earth-bench .bench-seat{width:56px;height:10px; background:#b98a5a; border:3px solid var(--brown); border-radius:2px;}
.earth-bench .bench-legs{display:flex; gap:20px; margin-top:2px;}
.earth-bench .bench-legs span{width:6px;height:14px; background:#6b4f2e; border:2px solid var(--brown);}
/* 牛皮纸餐袋 & 半杯可乐贴图 */
.earth-bag{position:absolute; bottom:14px; left:96px; z-index:4; font-size:18px; opacity:.9; transform:rotate(-6deg);}
.earth-cola{position:absolute; bottom:12px; left:150px; z-index:4; font-size:16px; opacity:.85;}
/* 复古路牌挂件：文字轮播 */
.earth-sign{position:absolute; top:14px; right:16px; z-index:5; display:flex; align-items:center; gap:4px; background:#f5e7c8; border:3px solid var(--brown); border-radius:3px; padding:4px 8px; box-shadow:0 3px 0 rgba(58,43,30,.25);}
.earth-sign .sign-post{width:6px;height:30px; background:#8a5a2b; border:2px solid var(--brown); border-radius:0 0 2px 2px;}
.earth-sign .sign-text{font-size:11px; color:#6b4f2e; font-weight:bold; min-width:56px; text-align:center; white-space:nowrap;}
/* LED 跑马灯公告栏 */
.earth-led{margin:0 0 12px; background:#3a2f22; color:#f3d58a; border:3px solid var(--brown); border-radius:4px; padding:8px 12px; overflow:hidden; white-space:nowrap; box-shadow:inset 0 0 8px rgba(0,0,0,.6);}
.earth-led .led-inner{display:inline-block; animation:ledScroll 14s linear infinite; font-size:12px; letter-spacing:1px;}
@keyframes ledScroll{0%{transform:translateX(100%);}100%{transform:translateX(-100%);}}
/* 稳定补给清单 / 评分 / 备忘录 / 软预算 */
.earth-stable{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
@media(max-width:820px){.earth-stable{grid-template-columns:repeat(2,1fr);}}
.stable-card{padding:10px; border:3px solid var(--brown); background:linear-gradient(180deg,#faf3df,#f3e6c4); border-radius:4px; box-shadow:0 3px 0 rgba(58,43,30,.15); cursor:pointer;}
.stable-card:hover{transform:translateY(-2px);}
.stable-card .sn{font-size:12px; font-weight:bold; color:#6b4f2e;}
.stable-card .sp{font-size:10px; color:var(--brown-soft); margin:4px 0;}
.stable-card .ss{font-size:10px; color:#c98a4b; font-weight:bold;}
.score-pill{display:inline-block; background:#c98a4b; color:#fff; font-size:10px; padding:2px 7px; border-radius:3px; border:2px solid #a5713a; margin-left:6px;}
/* 凑单助手（非地球派系用） */
.assist-box{border:3px dashed #c98a4b; background:var(--cream); border-radius:4px; padding:12px; margin-top:10px;}
.assist-box .assist-title{font-size:12px; font-weight:bold; color:#6b4f2e; margin-bottom:8px;}
.assist-ops{display:flex; gap:8px; flex-wrap:wrap;}
/* 软预算进度条（米黄，无红色告警） */
.budget-bar{margin-top:12px; padding:10px; border:3px solid var(--brown); background:linear-gradient(180deg,#faf3df,#f3e6c4); border-radius:4px;}
.budget-bar .bb-label{font-size:11px; color:#6b4f2e; margin-bottom:6px; display:flex; justify-content:space-between;}
.budget-bar .bb-track{height:16px; border:3px solid var(--brown); background:#f5e7c8; border-radius:3px; overflow:hidden;}
.budget-bar .bb-fill{height:100%; background:repeating-linear-gradient(45deg,#e8b04b 0 8px,#d89c3c 8px 16px); transition:width .3s steps(6);}
.budget-bar .bb-tip{font-size:11px; color:#a5713a; margin-top:6px;}
/* Slogan 底部轮播 */
.earth-slogan{text-align:center; font-size:12px; color:#a5713a; margin-top:14px; padding:10px; border-top:3px solid #e7c694; letter-spacing:1px;}
/* ---------- 大胃食客·饱腹派系 CSS ---------- */
/* 胃袋充能条（像素块进度，橙色系） */
.stomach-bar{margin-top:8px; padding:10px; border:3px solid var(--brown); background:#fffdf5; border-radius:3px;}
.sb-label{font-size:11px; color:#6b4f2e; margin-bottom:6px; display:flex; justify-content:space-between; align-items:center; gap:6px;}
.sb-track{height:18px; border:3px solid var(--brown); background:#f5e7c8; border-radius:3px; overflow:hidden;}
.sb-fill{height:100%; background:repeating-linear-gradient(45deg,#f08c1a 0 8px,#e0780a 8px 16px); transition:width .35s steps(8);}
.sb-fill.full{background:repeating-linear-gradient(45deg,#d94013 0 8px,#c23509 8px 16px);}
.sb-tip{font-size:11px; color:#a5713a; margin-top:6px;}
/* 干饭场景装饰 */
.food-scene{position:relative; overflow:hidden; border-radius:6px;}
.food-monument{position:absolute; top:8px; right:16px; font-size:22px; display:flex; flex-direction:column; gap:2px; opacity:.85; pointer-events:none; z-index:1;}
.food-fries{position:absolute; top:120px; right:10px; font-size:20px; opacity:.8; pointer-events:none; z-index:1;}
.food-cola{position:absolute; top:60px; left:12px; font-size:20px; opacity:.8; pointer-events:none; z-index:1;}
/* 徽章解锁动画 */
@keyframes badgePop{0%{transform:scale(.4) rotate(-6deg);opacity:0;}60%{transform:scale(1.15) rotate(3deg);}100%{transform:scale(1) rotate(0);opacity:1;}}
.badge-pop{animation:badgePop .6s steps(6); border-color:#f08c1a !important; box-shadow:0 0 12px rgba(240,140,26,.65) !important; opacity:1 !important; filter:none !important;}
.badge-wall{grid-template-columns:repeat(4,1fr);}
@media(max-width:640px){.badge-wall{grid-template-columns:repeat(2,1fr);}}
/* 折叠面板 */
.fold-card{position:relative;}
.fold-head{display:flex; align-items:center; justify-content:space-between; gap:10px; cursor:pointer; user-select:none; padding:2px 0;}
.fold-head h2{margin:0; flex:1;}
.fold-head .fold-arrow{font-size:12px; color:#a5713a; transition:transform .12s steps(2); flex:0 0 auto;}
.fold-body{margin-top:12px;}
.fold-card.collapsed .fold-body{display:none;}
.fold-card.collapsed .fold-arrow{transform:rotate(-90deg);}
.fold-card.collapsed{opacity:.92;}
/* 高饱腹单品榜紧凑双列 */
.rec-grid-2{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
@media(max-width:820px){.rec-grid-2{grid-template-columns:1fr;}}
.rec-grid-2 .rec-card{margin:0; padding:6px 8px; gap:6px; flex-wrap:wrap;}
.rec-grid-2 .rec-thumb{width:32px; height:32px;}
/* 今日任务面板 */
.quest-row{display:flex; align-items:center; gap:6px; padding:4px 0; border-bottom:2px dashed #e7c694; font-size:11px;}
.quest-row:last-child{border-bottom:none;}
.quest-row .q-check{width:14px; height:14px; border:3px solid var(--brown); background:#fff; flex:0 0 auto; display:flex; align-items:center; justify-content:center; font-size:10px; color:var(--green); font-weight:bold;}
.quest-row.done .q-check{background:#eaffea;}
.quest-row.done{color:#8a5a2b; text-decoration:line-through; text-decoration-thickness:1px;}
/* 麦麦投喂清单 */
.planner-head{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
.planner-toggle{display:flex; align-items:center; gap:8px; cursor:pointer; user-select:none;}
.planner-toggle .sw{width:52px;height:26px; border:3px solid var(--brown); background:#f5e7c8; border-radius:14px; position:relative; transition:background .2s;}
.planner-toggle .sw .knob{position:absolute; top:2px; left:2px; width:16px;height:16px; background:var(--cream-light); border:2px solid var(--brown); border-radius:50%; transition:left .2s;}
.planner-toggle.on .sw{background:#e8b04b;}
.planner-toggle.on .sw .knob{left:28px;}
.planner-toggle .sw-label{font-size:12px; color:#6b4f2e; font-weight:bold;}
.planner-input{border:3px dashed #c98a4b; background:var(--cream); border-radius:4px; padding:12px; margin-top:12px;}
.planner-input .pi-label{font-size:12px; color:#6b4f2e; margin-bottom:8px;}
.planner-plans{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:12px;}
@media(max-width:820px){.planner-plans{grid-template-columns:1fr;}}
.plan-card{border:3px solid var(--brown); background:linear-gradient(180deg,#faf3df,#f3e6c4); border-radius:4px; padding:12px; position:relative; display:flex; flex-direction:column; box-shadow:0 3px 0 rgba(58,43,30,.15);}
.plan-card .pc-tag{font-size:13px; font-weight:bold; color:#6b4f2e;}
.plan-card .pc-sub{font-size:10px; color:#a5713a; margin:3px 0 8px;}
.plan-card .pc-items{font-size:11px; color:#5b4632; line-height:1.7;}
.plan-card .pc-coupon{font-size:10px; color:var(--brown-soft); margin:6px 0;}
.plan-card .pc-foot{margin-top:auto; display:flex; align-items:flex-end; justify-content:space-between; padding-top:8px;}
.plan-card .pc-price{font-size:15px; color:var(--red); font-weight:bold;}
.plan-card .pc-save{font-size:10px; color:var(--grass);}
.plan-card .pc-score{position:absolute; top:8px; right:8px; background:#c98a4b; color:#fff; font-size:10px; padding:2px 7px; border-radius:3px; border:2px solid #a5713a;}
.planner-note{font-size:10px; color:#a5713a; margin-top:10px; line-height:1.6;}
/* 地球NPC 左侧主内容 + 右侧常驻购物车 两栏布局 */
.earth-layout{display:grid; grid-template-columns:1fr 320px; gap:14px; align-items:start;}
@media(max-width:900px){.earth-layout{grid-template-columns:1fr;}}
.earth-main{min-width:0;}
.sticky-cart{position:sticky; top:12px; border:4px solid var(--brown); background:linear-gradient(180deg,#faf3df,#f3e6c4); border-radius:6px; padding:12px; box-shadow:0 4px 0 rgba(58,43,30,.2); transition:border-color .15s, box-shadow .15s;}
.sticky-cart .sc-head{display:flex; align-items:center; justify-content:space-between; font-size:12px; padding-bottom:8px; border-bottom:3px solid #e7c694; margin-bottom:8px;}
.sticky-cart .sc-tip{font-size:11px; color:var(--grass); margin-bottom:8px;}
.sticky-cart .sc-list{max-height:320px; overflow:auto;}
.sticky-cart.flash{border-color:var(--red); box-shadow:0 0 0 3px var(--gold), 0 4px 0 rgba(58,43,30,.2);}

/* 补给储备库：续航配方 + 待试补给清单 */
.recipe-list{display:flex; flex-direction:column; gap:10px; margin-top:10px;}
.recipe-card{border:3px solid var(--brown); background:linear-gradient(180deg,#faf3df,#f3e6c4); border-radius:4px; padding:12px; box-shadow:0 3px 0 rgba(58,43,30,.15);}
.recipe-card .rc-head{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px;}
.recipe-card .rc-name{font-size:13px; font-weight:bold; color:#6b4f2e;}
.recipe-card .rc-total{font-size:15px; color:var(--red); font-weight:bold;}
.recipe-card .rc-items{display:flex; flex-direction:column; gap:4px;}
.recipe-card .rc-row{display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:12px; color:#5b4632;}
.recipe-card .rc-tune{display:inline-flex; align-items:center; gap:6px;}
.recipe-card .rc-foot{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
.wish-list{display:flex; flex-direction:column; gap:8px; margin-top:10px;}
.wish-row{display:flex; align-items:center; gap:8px; padding:8px 10px; border:2px solid #e7c694; background:#fffdf5; border-radius:4px;}
.wish-row.added{border-color:var(--gold); background:#fdf6df;}
.wish-row .ci-name{flex:1;}

/* ---------- 预算输入弹卡 ---------- */
.budget-modal{position:fixed; inset:0; z-index:200; background:rgba(58,43,30,.55); display:flex; align-items:center; justify-content:center; padding:20px;}
.budget-modal .bm-box{
  width:min(460px,92vw); background:linear-gradient(180deg,#faf3df,#f0e2c0);
  border:4px solid var(--brown); border-radius:6px; box-shadow:0 6px 0 rgba(58,43,30,.4), inset 0 2px 0 rgba(255,255,255,.6);
  padding:22px; position:relative;
}
.budget-modal .bm-title{font-size:16px; font-weight:bold; color:#6b4f2e; margin-bottom:6px; text-align:center;}
.budget-modal .bm-sub{font-size:11px; color:#a5713a; text-align:center; margin-bottom:16px; line-height:1.6;}
.budget-modal .bm-row{display:flex; align-items:center; gap:10px; margin-bottom:14px; justify-content:center;}
.budget-modal .bm-yen{font-size:22px; color:var(--red); font-weight:bold;}
.budget-modal .bm-decor{display:flex; gap:10px; justify-content:center; margin-bottom:14px; font-size:26px;}
.budget-modal .bm-decor span{display:inline-block; animation:bmFloat 2.4s ease-in-out infinite;}
.budget-modal .bm-decor span:nth-child(2){animation-delay:.3s;}
.budget-modal .bm-decor span:nth-child(3){animation-delay:.6s;}
.budget-modal .bm-decor span:nth-child(4){animation-delay:.9s;}
@keyframes bmFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
.budget-modal .bm-input{
  width:150px; font:inherit; font-size:22px; font-family:'Press Start 2P','Zpix',monospace; text-align:center;
  padding:12px 8px; border:3px solid var(--brown); background:var(--cream-light); border-radius:4px; color:var(--red);
}
.budget-modal .bm-unit{font-size:16px; color:#6b4f2e; font-weight:bold;}
.budget-modal .bm-hint{font-size:10px; color:var(--brown-soft); text-align:center; margin-bottom:16px;}
.budget-modal .bm-actions{display:flex; gap:10px;}
.budget-modal .bm-actions .btn{flex:1; text-align:center; font-size:13px; padding:12px 8px;}

/* ========== 随缘行者 · 盲盒扭蛋 ========== */
.gacha-themes{display:grid; grid-template-columns:repeat(5,1fr); gap:12px; margin-top:14px;}
@media(max-width:900px){.gacha-themes{grid-template-columns:repeat(2,1fr);}}
@media(max-width:560px){.gacha-themes{grid-template-columns:1fr;}}
.gacha-theme-card{border:3px solid var(--brown); border-radius:6px; padding:14px 12px; cursor:pointer;
  background:linear-gradient(180deg,#faf3df,#f3e6c4); box-shadow:0 3px 0 rgba(58,43,30,.15);
  display:flex; flex-direction:column; align-items:center; text-align:center; gap:6px; transition:transform .12s, box-shadow .12s;}
.gacha-theme-card:hover{transform:translateY(-3px); box-shadow:0 6px 0 rgba(58,43,30,.2);}
.gacha-theme-card .gt-emoji{font-size:34px; line-height:1;}
.gacha-theme-card .gt-name{font-size:15px; font-weight:bold; color:#6b4f2e;}
.gacha-theme-card .gt-hint{font-size:10px; color:#a5713a;}
.gacha-theme-card .gt-desc{font-size:10px; color:#8a5a2b; line-height:1.6;}
/* 扭蛋机 */
.gacha-machine{position:relative; display:flex; flex-direction:column; align-items:center; padding:20px 0;}
.gacha-glass{width:min(320px,80vw); height:300px; position:relative; border:5px solid var(--brown); border-radius:16px;
  background:linear-gradient(180deg,#f7ecd2,#e7cfa6); box-shadow:inset 0 0 0 6px #c9a06a, 0 6px 0 rgba(58,43,30,.25); overflow:hidden;}
.gacha-glass::after{content:''; position:absolute; left:8%; top:10%; width:20%; height:60%; background:rgba(255,255,255,.35); border-radius:50%; transform:rotate(8deg); pointer-events:none;}
.gacha-glass .gg-balls{position:absolute; bottom:18px; left:50%; transform:translateX(-50%); display:flex; gap:14px; font-size:40px; filter:drop-shadow(0 4px 3px rgba(0,0,0,.2));}
.gacha-glass .gg-balls span{transition:transform .4s;}
.gacha-glass .gg-ball{width:64px; height:64px; border-radius:50%; position:absolute; box-shadow:inset -8px -8px 0 rgba(0,0,0,.18), 0 4px 0 rgba(58,43,30,.3);}
.gacha-capsule{width:44px; height:56px; border-radius:22px; position:absolute; left:50%; transform:translateX(-50%); top:18px;
  box-shadow:inset -6px -6px 0 rgba(0,0,0,.15), 0 3px 0 rgba(58,43,30,.3);}
.gacha-base{width:min(340px,84vw); height:56px; background:linear-gradient(180deg,#d9a95c,#b9833f); border:5px solid var(--brown); border-radius:10px;
  margin-top:-2px; display:flex; align-items:center; justify-content:center; box-shadow:0 5px 0 rgba(58,43,30,.25);}
.gacha-base .gb-slot{width:60px; height:34px; background:#3a2b1e; border-radius:6px; border:3px solid #6b4f2e;}
.gacha-lever{width:16px; height:70px; background:linear-gradient(90deg,#e8b04b,#b9833f); border:3px solid var(--brown); border-radius:8px;
  position:absolute; right:24px; top:-34px; transform-origin:bottom center; cursor:pointer; box-shadow:0 3px 0 rgba(58,43,30,.3);}
.gacha-lever .gl-knob{width:30px; height:30px; border-radius:50%; background:var(--red); border:3px solid var(--brown); position:absolute; top:-8px; left:50%; transform:translateX(-50%); box-shadow:0 2px 0 rgba(0,0,0,.25);}
/* 晃动动画 */
.gacha-machine.shaking .gacha-glass{animation:gachaShake .5s ease-in-out infinite;}
.gacha-machine.shaking .gacha-lever{animation:leverPull .5s ease-in-out infinite;}
.gacha-machine.shaking .gg-balls span{animation:ballBounce .5s ease-in-out infinite;}
@keyframes gachaShake{0%,100%{transform:rotate(0);}25%{transform:rotate(-4deg);}50%{transform:rotate(4deg);}75%{transform:rotate(-2deg);}}
@keyframes leverPull{0%,100%{transform:rotate(0);}50%{transform:rotate(-45deg);}}
@keyframes ballBounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-14px);}}
/* 掉落扭蛋 */
.gacha-drop{position:absolute; left:50%; top:40%; font-size:56px; transform:translate(-50%,-50%); animation:gachaDrop .7s ease-in forwards; z-index:5;}
@keyframes gachaDrop{0%{opacity:0; transform:translate(-50%,-120%);}60%{opacity:1; transform:translate(-50%,-10%);}80%{transform:translate(-50%,-50%) scale(1.1);}100%{transform:translate(-50%,-50%) scale(1);}}
/* 签文弹窗 */
.gacha-modal{position:fixed; inset:0; z-index:600; background:rgba(58,43,30,.55); display:flex; align-items:center; justify-content:center; padding:16px;}
.gacha-modal .gm-card{width:min(480px,94vw); max-height:90vh; overflow:auto; background:linear-gradient(180deg,#faf3df,#f3e6c4);
  border:5px solid var(--brown); border-radius:8px; padding:20px; box-shadow:0 10px 0 rgba(0,0,0,.3); position:relative;}
.gacha-modal .gm-card.hidden-flash{animation:hiddenGlow 1.2s ease-in-out infinite;}
@keyframes hiddenGlow{0%,100%{box-shadow:0 10px 0 rgba(0,0,0,.3), 0 0 0 0 rgba(232,176,75,0);}50%{box-shadow:0 10px 0 rgba(0,0,0,.3), 0 0 0 6px rgba(232,176,75,.7);}}
.gacha-modal .gm-title{font-size:18px; font-weight:bold; color:#6b4f2e; text-align:center;}
.gacha-modal .gm-hidden-tag{display:inline-block; background:var(--red); color:#fff; font-size:11px; padding:3px 10px; border-radius:3px; margin:8px 0;}
.gacha-modal .gm-items{margin:12px 0; display:flex; flex-direction:column; gap:6px;}
.gacha-modal .gm-item{display:flex; align-items:center; gap:8px; font-size:13px; color:#5b4632;}
.gacha-modal .gm-item img{width:40px; height:40px; object-fit:cover; border-radius:4px; border:2px solid #e7c694;}
.gacha-modal .gm-price{text-align:center; margin:10px 0;}
.gacha-modal .gm-price .big{font-size:24px; color:var(--red); font-weight:bold;}
.gacha-modal .gm-coupon{font-size:11px; color:var(--green); text-align:center;}
.gacha-modal .gm-sign{text-align:center; margin:14px 0; padding:12px; background:#f6ecd2; border:2px dashed #c9a97a; border-radius:6px;
  font-size:14px; color:#b5482f; line-height:1.7;}
.gacha-modal .gm-luck{text-align:center; margin:10px 0; font-size:13px; color:#8a5a2b;}
.gacha-modal .gm-luck b{font-size:20px; color:var(--gold);}
.gacha-modal .gm-actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px;}
.gacha-modal .gm-actions .btn{flex:1; min-width:110px;}
.gacha-modal .gm-close{position:absolute; top:8px; right:10px; cursor:pointer; font-size:20px; color:var(--brown-soft);}
/* 欧气分享卡画布容器 */
.gacha-card-wrap{display:flex; flex-direction:column; align-items:center; gap:10px;}

</style>
</head>
<body>
<div id="bgScene" aria-hidden="true">
  <img id="bgSceneImg" src="assets/city-gz-px.png" alt="">
</div>
<div id="leafLoader">

// 估算饱腹值/卡路里（按类别）
function _satKcal(cat){
  if(cat==='主餐') return {satiety:4,kcal:480};
  if(cat==='套餐') return {satiety:5,kcal:700};
  if(cat==='小食') return {satiety:2,kcal:250};
  if(cat==='甜品') return {satiety:1,kcal:200};
  if(cat==='饮料') return {satiety:1,kcal:120};
  if(cat==='随心配') return {satiety:3,kcal:400};
  return {satiety:1,kcal:100};
}
// 名称 -> 标签（忌口过滤用）
function _tagsOf(name){
  const tags=[];
  if(/牛肉|牛堡|巨无霸|吉士/.test(name)) tags.push('牛肉');
  if(/鸡|麦乐|V翅|脆汁|鸡块/.test(name)) tags.push('鸡肉');
  if(/辣|龙焰|咖喱/.test(name)) tags.push('辣');
  if(/薯|鸡翅|炸|脆|薄皮|V翅|鸡块/.test(name)) tags.push('油炸');
  if(/奶|拿铁|雪冰|黑巧|咖啡|新地|旋风|圆筒|冰淇淋|麦炫酷/.test(name)) tags.push('乳');
  if(/甜|旋风|新地|圆筒|冰淇淋|派|黑巧|柠/.test(name)) tags.push('甜');
  if(/冰|雪冰|可乐|雪碧|汽水/.test(name)) tags.push('冰');
  if(/咖啡|浓缩|美式|拿铁|红茶/.test(name)) tags.push('咖啡');
  if(/素|苹果|玉米|薯|蔬菜/.test(name)) tags.push('素');
  if(/帽|丝巾|捶|水手|周边/.test(name)) tags.push('周边');
  return tags;
}
// 由快照行构造 MENU 项
function _menuItemFromRow(code, d, cat){
  const sk=_satKcal(cat||'其他');
  return {
    id: code, name:d.name, cat:cat||'其他', price:Number(d.price), orig:Number(d.orig),
    kcal:sk.kcal, satiety:sk.satiety, tags:_tagsOf(d.name), img:d.img, oneplus:(cat==='随心配'),
  };
}
// 从快照重建 MENU / MENU_MAP
function _buildMenuFromFallback(){
  const items = Object.entries(MCP_MEALS_FALLBACK).map(([code,d])=>{
    const cat = MCP_CODE_CAT[code] || '其他';
    return _menuItemFromRow(code, d, cat);
  });
  return items;
}

// 从云数据库拉取真实菜单（menu_items 表，公开可读）
async function loadMenuFromCloud(){
  if(!cloud) return false;
  try {
    const { data, error } = await cloud.database
      .from('menu_items')
      .select('*')
      .order('sort', { ascending: true });
    if(error || !Array.isArray(data) || data.length===0) return false;
    MENU = data.map(r=>({
      id: String(r.sku), name: r.name, cat: r.cat,
      price: Number(r.price), orig: Number(r.orig ?? r.price),
      kcal: Number(r.kcal ?? 300), satiety: Number(r.satiety ?? 2),
      tags: Array.isArray(r.tags) ? r.tags : [],
      img: r.img, oneplus: !!r.oneplus,
    }));
    MENU_MAP = Object.fromEntries(MENU.map(m=>[m.id,m]));
    return true;
  } catch(e){
    console.warn('[menu] 云端拉取失败，使用内置快照', e && e.message);
    return false;
  }
}

  if(hit){

/* =========================================================
   云数据同步层（登录后自动持久化购物车 / 心愿单 / 派系 / 订单）
   未登录或 SDK 不可用时静默降级为本地内存，不阻塞点餐流程
   ========================================================= */
let _session = null;          // 当前登录会话缓存
let _cloudReady = false;      // 云库是否可用
async function getSession(){
  if(_session) return _session;
  if(!cloud) return null;
  try{
    const { data, error } = await cloud.auth.getSession();
    if(error || !data){ _session = null; return null; }
    _session = data;
    return data;
  }catch(e){ return null; }
}
async function currentUser(){
  const s = await getSession();
  return s && s.user ? s.user : null;
}
function isLoggedIn(){ return !!_session; }

// 从云端恢复：派系 + 心愿单 + 购物车（登录后调用一次）
async function restoreFromCloud(){
  if(!cloud || !isLoggedIn()) return;
  try{
    // 1) 用户档案（派系）
    const p = await cloud.database.from('user_profiles').select('*').maybeSingle();
    if(p.data && p.data.faction){
      state.faction = p.data.faction;
      if(p.data.custom_quote) state.customQuote = p.data.custom_quote;
    }
    // 2) 心愿单（取最新一条自定义语录）
    const w = await cloud.database.from('wishlist').select('*').eq('quote_type','custom').order('created_at',{ascending:false}).limit(1);
    if(w.data && w.data.length && w.data[0].content) state.customQuote = w.data[0].content;
    // 3) 购物车
    const c = await cloud.database.from('cart_items').select('*');
    if(c.data && c.data.length){
      state.cart = c.data.map(r=>({id:String(r.sku), qty:Number(r.qty)}));
    }
    _cloudReady = true;
  }catch(e){
    console.warn('[cloud] 恢复数据失败', e && e.message);
  }
}

// 购物车 → 云库（整体替换，简单可靠）
async function syncCart(){
  if(!cloud || !isLoggedIn()) return;
  try{
    await cloud.database.from('cart_items').delete().neq('id', 0); // 清空本人购物车
    if(state.cart.length){
      const rows = state.cart.map(c=>({ sku: c.id, qty: c.qty }));
      await cloud.database.from('cart_items').insert(rows);
    }
  }catch(e){ console.warn('[cloud] 同步购物车失败', e && e.message); }
}
// 派系 → 云库（upsert 用户档案）
async function syncProfile(){
  if(!cloud || !isLoggedIn()) return;
  try{
    const payload = { faction: state.faction, custom_quote: state.customQuote || null };
    const { data } = await cloud.database.from('user_profiles').select('id').maybeSingle();
    if(data && data.id){
      await cloud.database.from('user_profiles').update(payload).eq('id', data.id);
    } else {
      await cloud.database.from('user_profiles').insert(payload);
    }
  }catch(e){ console.warn('[cloud] 同步用户档案失败', e && e.message); }
}
// 心愿单 → 云库（追加一条自定义语录）
async function syncWishlist(){
  if(!cloud || !isLoggedIn() || !state.customQuote) return;
  try{
    await cloud.database.from('wishlist').insert({ content: state.customQuote, quote_type: 'custom' });
  }catch(e){ console.warn('[cloud] 同步心愿单失败', e && e.message); }
}
// 下单 → 云库（生成真实订单记录）
async function placeOrder(){
  if(!cloud || !isLoggedIn()) return null;
  const cart = cartWithItems();
  if(!cart.length) return null;
  const best = computeBest(cart, state.channel);
  try{
    const { data, error } = await cloud.database.from('orders').insert({
      items: cart.map(c=>({ sku:c.item.id, name:c.item.name, qty:c.qty, price:c.item.price })),
      total: best.total,
      coupon: best.applied.length ? best.applied.map(a=>a.name).join('、') : null,
      status: 'created',
    }).select();
    return (data && data[0]) || null;
  }catch(e){
    console.warn('[cloud] 下单失败', e && e.message);
    return null;
  }
}

function renderAvatar(rows, scale=10){
  const c=document.createElement('canvas');
  const H=rows.length, W=Math.max(...rows.map(r=>r.length));
  c.width=W*scale; c.height=H*scale;
  const ctx=c.getContext('2d'); ctx.imageSmoothingEnabled=false;
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    const col=PAL[(rows[y]||'')[x]]; if(!col) continue;
    ctx.fillStyle=col; ctx.fillRect(x*scale,y*scale,scale,scale);
  }
  return c;
}

/* =========================================================
   优惠计算
   ========================================================= */
function computeBogo(cart){
  let save=0;
  cart.forEach(c=>{
    if(c.item.cat==='甜品'){ save += Math.floor(c.qty/2) * c.item.price * 0.5; }
  });
  return save;
}
function computeBest(cart, channel){
  const base = cartBase(cart);
  // 1+1
  const elig=[]; cart.forEach(c=>{ for(let i=0;i<c.qty;i++) if(c.item.oneplus) elig.push(c.item.price); });
  elig.sort((a,b)=>b-a);
  let opSave=0, opPairs=0;
  for(let i=0;i+1<elig.length;i+=2){ opSave += elig[i]+elig[i+1]-12.9; opPairs++; }
  const bogoSave = computeBogo(cart);
  let th={off:0,name:''};
  COUPONS.filter(c=>c.type==='threshold' && (!c.channel || c.channel===channel))
    .forEach(c=>{ if(base>=c.threshold && c.off>th.off) th={off:c.off,name:c.name}; });
  const opts=[
    {total: base-opSave-bogoSave, applied:[...(opPairs?[{name:'1+1随心配 12.9元',save:opSave}]:[]),...(bogoSave?[{name:'甜品第二份半价',save:bogoSave}]:[])]},
    {total: base-th.off-bogoSave, applied:[...(th.off?[{name:th.name,save:th.off}]:[]),...(bogoSave?[{name:'甜品第二份半价',save:bogoSave}]:[])]},
    {total: base-bogoSave, applied:[...(bogoSave?[{name:'甜品第二份半价',save:bogoSave}]:[])]},
  ];
  opts.sort((a,b)=>a.total-b.total);
  const best=opts[0];
  return {base, total:Math.max(0,best.total), savings:base-best.total, applied:best.applied};
}
function fillGap(cart, channel){
  const base=cartBase(cart); const cur=computeBest(cart,channel);
  const ths=COUPONS.filter(c=>c.type==='threshold' && (!c.channel||c.channel===channel))
    .map(c=>({t:c.threshold,off:c.off})).filter(o=>o.t>base).sort((a,b)=>a.t-b.t);
  for(const th of ths){
    const gap=th.t-base; if(gap>8) continue;
    const cand=MENU.filter(m=>m.price>=gap && m.price<th.off).sort((a,b)=>a.price-b.price);
    if(cand.length){
      const c=cand[0];
      return {item:c, add:c.price, threshold:th.t, off:th.off, netSave:th.off-c.price};
    }
  }
  return null;
}
// 温柔凑单助手：点单后自动匹配可用优惠券（满减/随心配/第二份半价）
function autoMatchCoupons(cart, channel){
  const base=cartBase(cart); if(!cart.length) return [];
  const matched=[];
  // 满减券（互斥，只取最高减免的一张，与 computeBest 一致）
  let bestTh=null;
  COUPONS.filter(c=>c.type==='threshold' && (!c.channel||c.channel===channel))
    .forEach(c=>{ if(base>=c.threshold && (!bestTh || c.off>bestTh.off)) bestTh={name:c.name, threshold:c.threshold, off:c.off}; });
  if(bestTh) matched.push({name:bestTh.name, desc:`已满 ${bestTh.threshold} 减 ${bestTh.off}`, save:bestTh.off, hit:true});
  // 1+1 随心配
  const op=cart.filter(c=>c.item.oneplus && c.qty>0);
  if(op.length>=2) matched.push({name:'1+1随心配', desc:`${op.length} 件随心配单品，任选 2 件 12.9 元`, save:null, hit:true});
  // 甜品第二份半价
  const desert=cart.filter(c=>c.item.cat==='甜品' && c.qty>=2);
  if(desert.length) matched.push({name:'甜品第二份半价', desc:`${desert.length} 款甜品第 2 份半价`, save:null, hit:true});
  return matched;
}
function compareChannels(cart){
  const instore=computeBest(cart,'instore').total;
  const delivery=computeBest(cart,'delivery').total + 6 + 2; // 配送费6 包装费2
  return {instore, delivery, better: instore<=delivery?'instore':'delivery'};
}

/* =========================================================
   麦麦投喂清单（地球NPC · 只看预算 + 优惠满减，不考虑口味）
   约束：所有方案优惠后实付 ≤ 预算；套餐丰富、价格梯度减小
   ========================================================= */
// 组合一组餐品的实付（复用优惠计算，含 1+1 随心配 / 满减 / 甜品第二份半价）
function planPrice(ids){
  const cart=ids.map(id=>({item:MENU_MAP[id], qty:1}));
  const best=computeBest(cart, state.channel||'instore');
  return {base:best.base, total:Math.round(best.total*10)/10,
          savings:Math.round(best.savings*10)/10, applied:best.applied};
}
// 生成预算内套餐方案（硬约束：实付 ≤ budget；不看口味，只看优惠满减）
// 输出按实付价格从低到高排列的多档套餐，相邻价位差小、覆盖丰富
function planMeals(budget){
  // 候选：非早餐、非限定（其余全保留，不按口味过滤）
  const avail=MENU.filter(m=>m.cat!=='早餐' && m.cat!=='限定' && !(m.limited));
  const mains=avail.filter(m=>m.cat==='主餐');
  const sides=avail.filter(m=>m.cat==='小食'||m.cat==='甜品'||m.cat==='饮料');
  // 生成候选组合：1+1随心配 / 主餐+副餐 / 主餐+双副餐
  const cands=[];
  const opMains=mains.filter(m=>m.oneplus);
  const opSides=sides.filter(m=>m.oneplus);
  opMains.forEach(a=>opSides.forEach(b=>{ cands.push({ids:[a.id,b.id], kind:'1+1随心配'}); }));
  mains.forEach(a=>sides.forEach(b=>{ cands.push({ids:[a.id,b.id], kind:'主餐+副餐'}); }));
  mains.forEach(a=>{
    for(let i=0;i<sides.length;i++) for(let j=i+1;j<sides.length;j++)
      cands.push({ids:[a.id,sides[i].id,sides[j].id], kind:'主餐+双副餐'});
  });

  // 计算实付，过滤 ≤ budget
  const scored=cands.map(c=>{
    const p=planPrice(c.ids);
    const base=c.ids.reduce((s,id)=>s+MENU_MAP[id].price,0);
    return { ids:c.ids, kind:c.kind, base, total:p.total, savings:p.savings, applied:p.applied };
  }).filter(s=>s.total<=budget+0.001);

  if(!scored.length) return null;

  // 去重（按 ids 排序后的 key）
  const seen=new Map();
  scored.forEach(s=>{ const k=[...s.ids].sort().join('|'); if(!seen.has(k)) seen.set(k,s); });
  let uniq=[...seen.values()];
  // 按实付从低到高排序（价格梯度减小，覆盖多价位）
  uniq.sort((a,b)=>a.total-b.total);

  // 按价位等距抽样出 N 档套餐（丰富且梯度均匀），最多 9 档
  const N=Math.min(9, uniq.length);
  const picks=[];
  if(uniq.length<=N){
    picks.push(...uniq);
  } else {
    // 等距抽样：保证从最低价到最高价均匀覆盖
    for(let i=0;i<N;i++){
      const idx=Math.round(i*(uniq.length-1)/(N-1));
      picks.push(uniq[idx]);
    }
    // 去重
    const dedup=[]; const used=new Set();
    picks.forEach(p=>{ const k=[...p.ids].sort().join('|'); if(!used.has(k)){used.add(k);dedup.push(p);} });
    picks.length=0; picks.push(...dedup);
  }

  return {
    budget, count:uniq.length, plans:picks.map(p=>({...p}))
  };
}
// 续航性价比评分：一元钱换来的饱腹能量（satiety / price 归一化到 0-10）
function valueScore(m){
  const raw = (m.satiety / m.price) * 20; // 基础分
  let s = raw;
  if(m.oneplus) s += 1.2;                 // 常驻随心配加成
  if(m.tags.includes('限定')) s -= 1.5;   // 高价限定后置
  if(m.tags.includes('甜') && m.cat==='甜品') s -= 0.8;
  s = Math.max(0, Math.min(10, s));
  return Math.round(s*10)/10;
}

  // 从需求文本里解析意图
  const wantsEveryoneBurger = /每人.*(汉堡|堡)|(汉堡|堡).*每人/.test(needText) || /都要.*汉堡|汉堡.*都要/.test(needText);
  const noCola = /不要.*可乐|不喝.*可乐|可乐.*不要|可乐.*不喝/.test(needText) || needs.includes('可乐');
  const wantFries = /小食|薯条/.test(needText) && !/不吃薯条|不要薯条/.test(needText);
  const someoneNoSpicy = /有人.*不吃辣|不吃辣/.test(needText) || needs.includes('辣');

  // 候选：过滤忌口 + 排除周边/咖啡（多人餐一般不含）
  const allowed = MENU.filter(m=>{
    if(m.cat==='周边') return false;
    // 忌口过滤
    for(const a of needs){
      if(a==='素食'){ if(!m.tags.includes('素')) return false; continue; }
      if(m.tags.includes(AVOID[a])) return false;
    }
    return true;
  });

  const mains = allowed.filter(m=>m.cat==='主餐' || m.cat==='套餐' || m.cat==='随心配');
  const sides = allowed.filter(m=>m.cat==='小食' || m.cat==='甜品' || m.cat==='饮料');
  if(!mains.length && !sides.length) return null;

  // 每人一份主餐
  const per = [];
  for(let i=0;i<n;i++){
    const name = '信徒'+(i+1);
    const items=[];
    if(mains.length){
      // 有人不吃辣 → 优先不辣主餐
      let pool = mains;
      if(someoneNoSpicy && i===0){ pool = mains.filter(m=>!m.tags.includes('辣')); if(!pool.length) pool=mains; }
      const m = pool[i % pool.length];
      items.push({item:m, qty:1});
    }
    per.push({name, items, sub:0, pay:0});
  }
  // 加一份小食/饮品（如果需求里有，或按人数加）
  if(wantFries || n>=2){
    const drink = sides.find(m=>!noCola && m.cat==='饮料' && !m.tags.includes('辣'));
    const snack = sides.find(m=>m.cat==='小食' && (!someoneNoSpicy || !m.tags.includes('辣')));
    const add = noCola ? snack : (snack||drink);
    if(add) per[0].items.push({item:add, qty:1});
  }

  const combined=[]; per.forEach(p=>p.items.forEach(x=>{
    const f=combined.find(c=>c.item.id===x.item.id); if(f)f.qty+=x.qty; else combined.push({item:x.item,qty:x.qty});
  }));
  const best=computeBest(combined,'instore');
  const subs=per.map(p=>p.items.reduce((s,x)=>s+x.item.price*x.qty,0));
  const totalSub=subs.reduce((a,b)=>a+b,0)||1;
  per.forEach((p,i)=>{ p.sub=subs[i]; p.pay=subs[i]/totalSub*best.total; });

  return {all:per, combined, best, per, totalSub, grand:best.total, budget};
}

function bindCityVideos(){
  const vids = $app.querySelectorAll('.cc-video');
  if(!vids.length) return;
  const tryPlay = v => {
    // 懒加载：首次才从 data-src 取真实地址
    const src = v.getAttribute('data-src');
    if(src && !v.getAttribute('src')){ v.setAttribute('src', src); v.load(); }
    try{ v.muted = true; v.playsInline = true; v.setAttribute('muted',''); v.setAttribute('playsinline',''); }catch(e){}
    const doPlay = () => { const p = v.play(); if(p && p.catch) p.catch(()=>{}); };
    if(v.readyState >= 2){ doPlay(); }
    else {
      v.addEventListener('canplay', doPlay, { once:true });
      v.addEventListener('loadeddata', doPlay, { once:true });
      v.load();
    }
  };
  const pause = v => { try{ v.pause(); }catch(e){} };
  if('IntersectionObserver' in (window||{}) && window.IntersectionObserver){
    const obs = new IntersectionObserver(es=>{
      es.forEach(e=>{ if(e.isIntersecting) tryPlay(e.target); else pause(e.target); });
    }, {threshold:.1});
    vids.forEach(v=>{ obs.observe(v); });
    // 首屏主动触发一次（让当前可见的卡片尽快播起来）
    vids.forEach(tryPlay);
  } else {
    vids.forEach(tryPlay);
  }
}

async function signInWithWorkBuddy(){
  if(!cloud){ toast('云服务未就绪，请稍后重试'); return; }
  try{
    const back = new URL(location.href); back.pathname='/';
    for(const key of ['code','state','provider']) back.searchParams.delete(key);
    const { data, error } = await cloud.auth.signInWithOAuth({ provider:'workbuddy', redirectTo: back.toString() });
    if(error){ toast('登录失败：'+error.message); return; }
    location.assign(data.url);
  }catch(e){ toast('登录失败，请重试'); }
}

async function sendPhoneCode(){
  if(!cloud){ toast('云服务未就绪'); return; }
  const phone=document.getElementById('phoneInput').value.trim();
  if(!/^1\d{10}$/.test(phone)){ setPhoneErr('请输入正确的 11 位手机号'); return; }
  setPhoneErr('');
  const sent = await cloud.auth.sendOtp({ phone });
  if(sent.error){ setPhoneErr(sent.error.message); return; }
  _pendingPhoneOtp = { phone, ...sent.data };
  toast('验证码已发送');
}
async function submitPhoneLogin(){
  if(!cloud){ toast('云服务未就绪'); return; }
  const pending=_pendingPhoneOtp;
  const phone=document.getElementById('phoneInput').value.trim();
  const code=document.getElementById('codeInput').value.trim();
  if(!pending || pending.phone!==phone){ setPhoneErr('请先获取验证码'); return; }
  if(!code){ setPhoneErr('请输入验证码'); return; }
  const done = await cloud.auth.verifyOtp({
    phone: pending.phone,
    verificationId: pending.verificationId,
    isExistingUser: pending.isExistingUser,
    token: code,
  });
  if(done.error){ setPhoneErr(done.error.message); return; }
  _pendingPhoneOtp=null;
  closeLoginModal();
  _session = { user: done.data.user };
  toast('登录成功，欢迎回来！');
  await restoreFromCloud();
  renderWelcome();
}

async function signOut(){
  if(cloud){ try{ await cloud.auth.signOut(); }catch(e){} }
  _session=null; _cloudReady=false;
  state.faction=null; clearCart(); state.customQuote='';
  toast('已退出登录');
  renderWelcome();
}

/* 下单：登录后写入订单表，未登录则引导登录 */
async function submitOrder(){
  if(!requireStore()) return;
  const cart = cartWithItems();
  if(!cart.length){ toast('还没有点餐，先加几件吧'); return; }
  if(!isLoggedIn()){
    toast('请先登录，下单会保存到你的账号');
    showLoginModal();
    return;
  }
  const order = await placeOrder();
  if(order){
    toast('下单成功！订单已保存');
    clearCart();
    renderTab();
  } else {
    toast('下单失败，请稍后重试');
  }
}

function menuListHtml(){
  const list=MENU.filter(m=>{
    if(state.menuCat!=='全部' && m.cat!==state.menuCat) return false;
    if(state.menuSearch && !m.name.includes(state.menuSearch)) return false;
    return true;
  });
  if(list.length===0) return '<div class="chinese" style="font-size:12px;color:#8a5a2b">没有匹配的菜品</div>';
  return list.map(m=>{
    const inCart = cartItem(m.id);

/* =========================================================
   大胃食客 · 饱腹信徒 —— 核心逻辑（干饭目标 / 规划器 / 段位 / 徽章 / 挑战 / 战绩卡）
   ========================================================= */
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function todayStr(d=new Date()){ const p=x=>String(x).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function isBreakfastTime(){ const h=new Date().getHours()+new Date().getMinutes()/60; return h>=5 && h<10.5; }
function inLimitedWindow(m){
  if(!m.limited) return true;
  const today=todayStr();
  return today>=m.limited.start && today<=m.limited.end;
}
function orderableNow(m){
  if(m.cat==='早餐') return isBreakfastTime();
  return inLimitedWindow(m);
}
function foodGoal(){
  const g=FOOD_GOALS.find(x=>x.key===state.foodGoalKey)||FOOD_GOALS[1];
  const people=Math.max(1,state.foodPeople||1);
  return {...g, people, target:g.sat*people};
}
function feastSatiety(ids){ return ids.reduce((s,id)=>s+(MENU_MAP[id]?MENU_MAP[id].satiety:0),0); }
// 干饭规划器：按饱腹目标生成三档方案（达标最省 / 分量均衡 / 超额管够）
function planFeast(){
  const goal=foodGoal(); const target=goal.target;
  const avail=MENU.filter(m=>m.cat!=='早餐' && m.cat!=='限定' && !m.limited && !m.tags.includes('周边'));
  const mains=avail.filter(m=>m.cat==='主餐');
  const sides=avail.filter(m=>m.cat==='小食'||m.cat==='甜品'||m.cat==='饮料');
  const cands=[];
  mains.forEach(a=>sides.forEach(b=>cands.push([a.id,b.id])));
  mains.forEach(a=>{ for(let i=0;i<sides.length;i++) for(let j=i+1;j<sides.length;j++) cands.push([a.id,sides[i].id,sides[j].id]); });
  mains.forEach(a=>mains.forEach(b=>{ if(a.id<b.id) sides.forEach(s=>cands.push([a.id,b.id,s.id])); }));
  const scored=cands.map(ids=>{
    const p=planPrice(ids);
    return {ids, sat:feastSatiety(ids), base:p.base, total:p.total, savings:p.savings, applied:p.applied};
  });
  let ok=scored.filter(s=>s.sat>=target);
  let short=!ok.length;
  if(short){
    const expanded=scored.map(s=>{
      const k=Math.max(2,Math.min(6,Math.ceil(target/Math.max(1,s.sat))));
      if(s.sat*k<target) return null;
      const ids=[]; for(let i=0;i<k;i++) ids.push(...s.ids);
      const p=planPrice(ids);
      return {ids, sat:s.sat*k, base:p.base, total:p.total, savings:p.savings, applied:p.applied, mult:k};
    }).filter(Boolean);
    if(expanded.length){ ok=expanded; short=false; }
    else {
      const maxSat=scored.reduce((mx,s)=>Math.max(mx,s.sat),0);
      ok=scored.filter(s=>s.sat>=maxSat-1);
    }
  }
  const seen=new Map();
  ok.forEach(s=>{ const k=[...s.ids].sort().join('|'); if(!seen.has(k)) seen.set(k,s); });
  const uniq=[...seen.values()];
  const fkey=s=>[...s.ids].sort().join('|');
  const cheap=uniq.slice().sort((a,b)=>(a.total-b.total)||(b.sat-a.sat))[0];
  const feast=uniq.slice().sort((a,b)=>(b.sat-a.sat)||(a.total-b.total))[0];
  let mid=null;
  const byMid=uniq.slice().sort((a,b)=>Math.abs(a.sat-(target+1))-Math.abs(b.sat-(target+1))||(a.total-b.total));
  for(const s of byMid){ const k=fkey(s); if(k!==fkey(cheap)&&k!==fkey(feast)){ mid=s; break; } }
  const pick=[cheap]; const used=new Set([fkey(cheap),fkey(feast)]);
  if(mid){ pick.push(mid); used.add(fkey(mid)); }
  pick.push(feast);
  for(const s of uniq.slice().sort((a,b)=>a.total-b.total)){
    if(pick.length>=3) break;
    const k=fkey(s); if(!used.has(k)){ used.add(k); pick.splice(1,0,s); }
  }
  return {goal, target, short, count:uniq.length, plans:[
    {tag:'✅ 达标最省方案', sub:'刚好喂饱目标，一分不多花', ...pick[0]},
    {tag:'⚖️ 分量均衡方案', sub:'饱腹略有余量，踏实不浪费', ...(pick[1]||pick[0])},
    {tag:'🔥 超额管够方案', sub:'分量拉满，干饭人的浪漫，管够！', ...(pick[2]||pick[0])},
  ]};
}
function planScore(ids){
  const items=ids.map(id=>MENU_MAP[id]);
  const avg=items.reduce((sum,m)=>sum+valueScore(m),0)/items.length;
  const p=planPrice(ids); const base=items.reduce((sum,m)=>sum+m.price,0);
  const bonus=Math.max(0, base-p.total)/base*3;
  let s=avg+bonus;
  return Math.round(Math.max(0,Math.min(10,s))*10)/10;
}

function foodStore(){ try{ return JSON.parse(localStorage.getItem('mcd_food')||'{}'); }catch(e){ return {}; } }
function foodSave(s){ try{ localStorage.setItem('mcd_food', JSON.stringify(s)); }catch(e){} }
function foodXp(){ return foodStore().xp||0; }
function rankOf(xp){
  let r=FOOD_RANKS[0], nxt=null;
  for(let i=0;i<FOOD_RANKS.length;i++){ if(xp>=FOOD_RANKS[i].xp) r=FOOD_RANKS[i]; else { nxt=FOOD_RANKS[i]; break; } }
  return {rank:r, next:nxt};
}
function unlockedBadges(){ return foodStore().badges||[]; }
function unlockBadge(id){
  const s=foodStore(); s.badges=s.badges||[];
  if(s.badges.includes(id)) return false;
  s.badges.push(id); foodSave(s);
  const b=FOOD_BADGES.find(x=>x.id===id);
  toast('🎖 解锁徽章「'+(b?b.name:id)+'」！');
  state._newBadges=(state._newBadges||[]).concat(id);
  return true;
}
function feastCheckIn(){
  const cart=cartWithItems();
  if(!cart.length){ toast('空盘不能入账，先吃点什么吧～'); return; }
  const goal=foodGoal();
  const sat=cart.reduce((a,c)=>a+c.item.satiety*c.qty,0);
  const best=computeBest(cart,state.channel);
  const s=foodStore();
  const before=rankOf(s.xp||0).rank;
  let gain=sat;
  const bless=Math.random()<0.15;
  if(bless) gain=Math.round(sat*1.5);
  s.xp=(s.xp||0)+gain;
  const today=todayStr();
  if(s.lastDay!==today){
    const y=todayStr(new Date(Date.now()-864e5));
    s.streak=(s.lastDay===y)?(s.streak||0)+1:1;
    s.lastDay=today;
  }
  foodSave(s);
  if(sat>=goal.target) unlockBadge('first_full');
  const cnt={}; cart.forEach(c=>cnt[c.item.id]=(cnt[c.item.id]||0)+c.qty);
  if((cnt['1120']||0)>=2) unlockBadge('tower4');
  if((s.streak||0)>=7) unlockBadge('streak7');
  if(best.total>=100) unlockBadge('big100');
  if(sat>=goal.target) markQuest('q_full');
  const after=rankOf(s.xp).rank;
  if(after.name!==before.name) toast('🎉 段位晋升：'+after.icon+' '+after.name+'！');
  else toast((bless?'✨ 麦门赐福！本次入账 XP×1.5，共 +':'干饭入账 +') + gain + ' 饱腹XP，当前 ' + after.icon + ' ' + after.name);
  renderTab();
  setTimeout(()=>{ state._newBadges=[]; }, 800);
}
function verifyChallenge(id){
  const cart=cartWithItems();
  if(!cart.length){ toast('先把挑战要吃的东西加进餐盘～'); return; }
  const sat=cart.reduce((a,c)=>a+c.item.satiety*c.qty,0);
  const best=computeBest(cart,state.channel);
  const mains=cart.filter(c=>c.item.cat==='主餐').reduce((a,c)=>a+c.qty,0);
  const pieces=cart.reduce((a,c)=>a+c.qty,0);
  const sidesN=pieces-mains;
  let ok=false, why='';
  if(id==='ch_30'){ ok=best.total<=30&&sat>=8; why='实付 '+money(best.total)+'，饱腹 '+sat+' 点（需 ≤¥30 且 ≥8点）'; }
  if(id==='ch_6l'){ ok=pieces>=6&&mains>=2; why='共 '+pieces+' 层，主餐 '+mains+' 个（需 ≥6 层且主餐 ≥2）'; }
  if(id==='ch_2b'){ ok=mains>=2&&sidesN>=1; why='主餐 '+mains+' 份 + 副餐 '+sidesN+' 份（需主餐 ≥2 且副 ≥1）'; }
  if(ok){ unlockBadge(id); toast('✅ 挑战达成！'+why); }
  else toast('❌ 还差一点：'+why);
  renderTab();
}
function rerollGrace(){ state.foodGraceIdx=(state.foodGraceIdx+1)%FOOD_GRACES.length; renderTab(); }

function markQuest(id){
  const s=foodStore();
  const today=todayStr();
  if(!s.quests || s.quests.date!==today) s.quests={date:today, done:{}};
  if(s.quests.done[id]) return false;
  s.quests.done[id]=true;
  const def=FOOD_QUESTS.find(x=>x.id===id);
  s.xp=(s.xp||0)+(def?def.xp:10);
  let allClear=false;
  if(FOOD_QUESTS.every(x=>s.quests.done[x.id])){ s.xp=(s.xp||0)+20; allClear=true; }
  foodSave(s);
  toast('📋 今日任务「'+(def?def.name:id)+'」完成 +'+(def?def.xp:10)+'XP');

// 售罄集合（门店卖完的单品，这里用营业时段模拟部分单品售罄）
function soldOutIds(){
  const h=new Date().getHours();
  const out=new Set();
  // 早餐单品（10:30 后下架）
  MENU.forEach(m=>{ if(m.cat==='早餐') out.add(m.id); });
  // 模拟：深夜(23点后)部分小食售罄（门店卖完）
  if(h>=23 || h<5){
    MENU.filter(m=>m.cat==='小食' && /鸡翅|V翅|麦乐|脆汁|鸡块/.test(m.name)).forEach(m=>out.add(m.id));
  }
  // 模拟：高峰(12-13点)部分限定售罄
  if(h>=12 && h<13){
    MENU.filter(m=>m.tags.includes('限定')).forEach(m=>out.add(m.id));
  }
  return out;
}
// 当前全局忌口（盲盒派系复用地球NPC的忌口标签）
function gachaAvoids(){
  const avoids = [...(state.earthTaboo||[])];
  return avoids;
}
// 把忌口项展开成「要排除的 tag 列表」（兼容 label「不吃牛肉」和短 tag「牛肉」两种）
function gachaAvoidTags(avoids){
  const tags = new Set();
  for(const a of avoids){
    // 先查 EARTH_TABOO_OPTS 是否有 label 匹配
    const opt = EARTH_TABOO_OPTS && EARTH_TABOO_OPTS.find(o=>o.label===a);
    if(opt && opt.tags){ opt.tags.forEach(t=>tags.add(t)); continue; }
    // 直接是短 tag
    if(AVOID && AVOID[a]) tags.add(AVOID[a]);
    else tags.add(a);
  }
  return tags;
}
// 判断单品是否被忌口命中
function gachaItemAllowed(m, avoids){
  const tags = gachaAvoidTags(avoids);
  for(const t of tags){
    if(t==='素食'){ if(!m.tags.includes('素')) return false; continue; }
    if(m.tags.includes(t)) return false;
  }
  return true;
}
// 按主题过滤出随机池（已做忌口/售罄/时段过滤）
function gachaPool(themeKey){
  const avoids = gachaAvoids();
  const sold = soldOutIds();
  const h = new Date().getHours();
  const isBreakfast = h>=5 && h<10.5;

  let pool = MENU.filter(m=>{
    // 硬性过滤：售罄 + 忌口 + 周边（不参与配餐）
    if(sold.has(m.id)) return false;
    if(!gachaItemAllowed(m, avoids)) return false;
    if(m.cat==='周边') return false;
    if(m.cat==='限定' && !m.tags.includes('限定')) return false; // 保险
    // 时段：早餐时段只留早餐，非早餐时段剔除早餐
    if(isBreakfast){ if(m.cat!=='早餐') return false; }
    else { if(m.cat==='早餐') return false; }
    return true;
  });

  switch(themeKey){
    case 'budget':   // 高性价比常驻：优先随心配/套餐/主餐，价格低优先
      pool = pool.filter(m=>m.cat==='随心配'||m.cat==='套餐'||m.cat==='主餐'||m.cat==='小食'||m.cat==='饮料')
        .sort((a,b)=>a.price-b.price);
      break;
    case 'slim':     // 低卡高蛋白无油炸：排除油炸/甜/乳，优先主餐+小食+饮料
      pool = pool.filter(m=>!m.tags.includes('油炸') && !m.tags.includes('甜') && !m.tags.includes('乳'))
        .filter(m=>m.cat==='主餐'||m.cat==='小食'||m.cat==='饮料'||m.cat==='随心配');
      break;
    case 'feast':    // 饱腹：satiety 高优先，主食充足
      pool = pool.filter(m=>m.cat==='主餐'||m.cat==='套餐'||m.cat==='随心配'||m.cat==='小食')
        .sort((a,b)=>b.satiety-a.satiety);
      break;
    case 'happy':    // 治愈：甜品/油炸/甜/限定
      pool = pool.filter(m=>m.cat==='甜品'||m.tags.includes('油炸')||m.tags.includes('甜')||m.tags.includes('限定'))
        .concat(MENU.filter(m=>m.tags.includes('限定')&&!pool.includes(m))); // 补限定
      break;
    case 'blind':    // 全盲：不额外过滤
    default:
      break;
  }
  // 去重
  const seen=new Set(); pool = pool.filter(m=>{ if(seen.has(m.id))return false; seen.add(m.id); return true; });
  return pool;
}
// 从池子里拼一套「能直接下单」的完整方案（主餐 + 副餐），复用 computeBest 算实付
// 预算红线：若用户已预设预算，所有方案优惠后实付 ≤ 预算（复用 planMeals 硬约束）
function rollGacha(themeKey){
  const pool = gachaPool(themeKey);
  if(!pool.length) return null;

  const mains = pool.filter(m=>m.cat==='主餐'||m.cat==='套餐'||m.cat==='随心配');
  const sides = pool.filter(m=>m.cat==='小食'||m.cat==='甜品'||m.cat==='饮料');

  const budgetSet = !!state.earthBudgetSet;
  const budget = Math.max(1, state.earthBudget||30);

  let ids=[];
  // 隐藏款判定（约 8% 概率）
  const isHidden = Math.random() < 0.08;
  if(isHidden && mains.length){
    // 隐藏款：随机主餐 + 一个冷门/限定单品
    const h = GACHA_HIDDEN[Math.floor(Math.random()*GACHA_HIDDEN.length)];
    const main = mains[Math.floor(Math.random()*mains.length)];
    ids = [main.id];
    if(sides.length){ const s = sides[Math.floor(Math.random()*sides.length)]; ids.push(s.id); }
    let p = planPrice(ids);
    // 隐藏款也守预算红线：超支则回退到预算内方案（保留隐藏款惊喜标注）
    if(budgetSet && p.total > budget + 0.001){
      const pl = planMeals(budget);
      if(pl && pl.plans && pl.plans.length){
        const fb = pl.plans[Math.floor(Math.random()*pl.plans.length)];
        ids = fb.ids; p = planPrice(ids);
      }
    }
    return { ids, hidden:true, hiddenName:h.name, hiddenNote:h.note, hiddenExtra:h.extra, total:p.total, base:p.base, savings:p.savings, applied:p.applied, budget, budgetSet };
  }

  // 普通：1~2 个主餐 + 0~2 个副餐，随机但保证可下单
  if(!mains.length) return null;
  const mainN = 1 + (Math.random()<0.35?1:0); // 1~2 份主餐
  for(let i=0;i<mainN && i<mains.length;i++){
    const pick = mains[Math.floor(Math.random()*mains.length)];
    if(!ids.includes(pick.id)) ids.push(pick.id);
  }
  const sideN = Math.random()<0.75 ? (1 + (Math.random()<0.4?1:0)) : 0; // 0~2 份副餐
  if(sides.length){
    for(let i=0;i<sideN && i<sides.length;i++){
      const pick = sides[Math.floor(Math.random()*sides.length)];
      if(!ids.includes(pick.id)) ids.push(pick.id);
    }
  }
  if(!ids.length) return null;

  let p = planPrice(ids);

  // 预算红线：已设预算且超支 → 回退到 planMeals 的预算内方案
  if(budgetSet && p.total > budget + 0.001){
    const pl = planMeals(budget);
    if(pl && pl.plans && pl.plans.length){
      const fallback = pl.plans[Math.floor(Math.random()*pl.plans.length)];
      ids = fallback.ids;
      p = planPrice(ids);
    }
    // 若仍无预算内方案（极端），保留原随机结果但前端会标注超支
  }

  return { ids, hidden:false, total:p.total, base:p.base, savings:p.savings, applied:p.applied, budget, budgetSet };
}

/* ---- 欧气值 / 抽卡次数（每天 2-3 次免费，localStorage 持久化） ---- */
function gachaDailyState(){
  const today = new Date().toDateString();
  let st;
  try{ st = JSON.parse(localStorage.getItem('mm_gacha')||'null'); }catch(e){ st=null; }
  if(!st || st.date!==today){
    st = { date:today, left:3 };  // 每天 3 次免费
    try{ localStorage.setItem('mm_gacha', JSON.stringify(st)); }catch(e){}
  }
  return st;
}
function consumeGacha(){
  const st = gachaDailyState();
  if(st.left<=0) return false;
  st.left--; try{ localStorage.setItem('mm_gacha', JSON.stringify(st)); }catch(e){}
  return true;
}
function gachaLeft(){ return gachaDailyState().left; }

// 4. 摇一摇：晃动动画 + 掉蛋 + 生成结果
function shakeGacha(){
  if(state.gachaShaking) return;
  if(gachaLeft()<=0){
    toast('今天的免费扭蛋用完了，看个广告或分享给朋友再扭一次吧～');
    showGachaLimitModal();
    return;
  }
  state.gachaShaking = true;
  const machine = document.getElementById('gachaMachine');
  const btn = document.getElementById('gachaShakeBtn');
  if(machine) machine.classList.add('shaking');
  if(btn){ btn.disabled = true; btn.textContent = '摇晃中…'; }

  // 晃动 ~1.2s 后出结果
  setTimeout(()=>{
    if(machine) machine.classList.remove('shaking');
    // 掉蛋
    const glass = document.getElementById('gachaGlass');
    if(glass){
      const drop = document.createElement('div');
      drop.className = 'gacha-drop';
      drop.textContent = '🥚';
      glass.appendChild(drop);
      setTimeout(()=>{ if(drop && drop.parentNode) drop.remove(); }, 750);
    }
    // 生成随机方案
    const result = rollGacha(state.gachaTheme);
    state.gachaResult = result;
    consumeGacha();
    if(btn){ btn.disabled = false; btn.textContent = '🕹️ 摇一摇'; }
    state.gachaShaking = false;
    if(result){
      setTimeout(()=>showGachaResult(result), 300);
    } else {
      toast('这个主题暂时没随到合适的，换个主题或放宽忌口试试～');
    }
  }, 1200);
}

/* =========================================================
   寻味旅人 · 情绪打卡 & 专属套餐推荐（两段式）
   第一段：情绪打卡页（6 档情绪 + 自由文本）
   第二段：专属套餐结果页（MOOD_MEALS 推荐，可拆解自定义）
   ========================================================= */
function inFace(r,cc){
  if(r<2||r>11) return false;
  if(cc<1||cc>12) return false;
  if(r<=2 && (cc<=1||cc>=12)) return false;
  if(r>=11 && (cc<=1||cc>=12)) return false;
  return true;
}
function makeEmotionCanvas(key, scale){
  scale=scale||6; const N=14;
  const c=document.createElement('canvas'); c.width=N*scale; c.height=N*scale;
  const ctx=c.getContext('2d'); ctx.imageSmoothingEnabled=false;
  const COL={great:'#ffdf85',happy:'#ffcf9e',calm:'#bcd6f7',blue:'#cdd8e8',sad:'#f7c6dc',break:'#f6b3ab'};
  const OUT='#2b1506', RED='#da291c', TEA='#2f6fd0';
  const P=(r,cc,col)=>{ ctx.fillStyle=col; ctx.fillRect(cc*scale,r*scale,scale,scale); };
  const tint=COL[key]||'#ffe9b0';
  const spec=EMOSPEC[key]||EMOSPEC.calm;
  for(let r=0;r<N;r++)for(let cc=0;cc<N;cc++) if(inFace(r,cc)) P(r,cc,tint);
  for(let r=0;r<N;r++)for(let cc=0;cc<N;cc++){
    if(inFace(r,cc)){
      const nb=[[r-1,cc],[r+1,cc],[r,cc-1],[r,cc+1]];
      if(nb.some(([a,b])=>a<0||b<0||a>=N||b>=N||!inFace(a,b))) P(r,cc,OUT);
    }
  }
  const eyes={
    dot:[[5,4],[5,5],[6,4],[6,5],[5,8],[5,9],[6,8],[6,9]],
    closed:[[5,4],[5,5],[5,6],[5,8],[5,9],[5,10]],
    low:[[6,4],[6,5],[6,8],[6,9]],
    x:[[5,4],[6,5],[6,4],[5,5],[5,8],[6,9],[6,8],[5,9]],
    happy:[[6,4],[5,5],[6,6],[6,8],[5,9],[6,10]]
  }[spec.eye]||[];
  eyes.forEach(([r,cc])=>P(r,cc,OUT));
  const mouths={
    grin:[[8,4],[8,5],[8,6],[8,7],[8,8],[8,9],[9,5],[9,8]],
    smile:[[8,4],[8,9],[9,5],[9,6],[9,7],[9,8]],
    flat:[[8,5],[8,6],[8,7],[8,8]],
    frown:[[8,5],[8,6],[8,7],[8,8],[7,4],[7,9]],
    open:[[8,5],[8,6],[8,7],[8,8],[10,5],[10,6],[10,7],[10,8],[9,5],[9,8]]
  }[spec.mouth]||[];
  mouths.forEach(([r,cc])=>P(r,cc,OUT));
  if(spec.mouth==='grin') [[9,6],[9,7]].forEach(([r,cc])=>P(r,cc,RED));
  if(spec.mouth==='open') [[9,6],[9,7],[10,6],[10,7]].forEach(([r,cc])=>P(r,cc,RED));
  if(spec.brow==='up') [[3,5],[4,4],[3,9],[4,10]].forEach(([r,cc])=>P(r,cc,OUT));
  if(spec.brow==='down') [[3,4],[4,5],[3,10],[4,9]].forEach(([r,cc])=>P(r,cc,OUT));
  if(key==='sad') [[7,4],[8,4]].forEach(([r,cc])=>P(r,cc,TEA));
  if(key==='break') [[7,4],[8,4],[7,9],[8,9]].forEach(([r,cc])=>P(r,cc,TEA));
  c.className='emo-canvas';
  return c;
}

function mealKcal(code){
  const m = MEALS_DATA[code]; const cust = healCustomOf(code);
  return m.rounds.reduce((s,r,i)=> s + (KCAL[cust[i]]||0), 0);
}
function mealExtra(code){
  const m = MEALS_DATA[code]; const cust = healCustomOf(code);
  return m.rounds.reduce((s,r,i)=> s + (choiceOf(r,cust[i]).diff||0), 0);

// 把配方一键加回订单
function addRecipeToCart(id){
  const recipes = getRecipes();
  const r = recipes.find(x=>x.id===id); if(!r) return;
  r.items.forEach(it=>{ if(MENU_MAP[it.id]){ addItem(it.id, it.qty); } });
  updateBottomBar();
  toast('配方已一键加入订单');
}
// 微调配方的某一项份量
function tuneRecipe(id, itemId, delta){
  const recipes = getRecipes();
  const r = recipes.find(x=>x.id===id); if(!r) return;
  const it = r.items.find(x=>x.id===itemId); if(!it) return;
  it.qty += delta;
  if(it.qty<=0) r.items = r.items.filter(x=>x.id!==itemId);
  if(!r.items.length) recipes.splice(recipes.indexOf(r),1);
  saveRecipes(recipes);
  renderTab();
}
function deleteRecipe(id){
  let recipes = getRecipes();
  recipes = recipes.filter(x=>x.id!==id);
  saveRecipes(recipes);
  renderTab();
}

function drawStar(ctx,cx,cy,r){
  ctx.beginPath();
  for(let i=0;i<5;i++){
    const a1=(i*72-90)*Math.PI/180, a2=((i*72-90)+36)*Math.PI/180;
    ctx.lineTo(cx+Math.cos(a1)*r, cy+Math.sin(a1)*r);
    ctx.lineTo(cx+Math.cos(a2)*r*0.45, cy+Math.sin(a2)*r*0.45);
  }
  ctx.closePath(); ctx.fill();
}
function wrapText(ctx,text,cx,y,maxW,lh){
  let line='', yy=y;
  for(const ch of text){
    if(ctx.measureText(line+ch).width>maxW){ ctx.fillText(line,cx,yy); line=ch; yy+=lh; }
    else line+=ch;
  }
  if(line) ctx.fillText(line,cx,yy);
}
function downloadWish(){
  drawWish();
  const c=document.getElementById('wishCanvas');
  const a=document.createElement('a');
  a.download='麦门信徒心愿卡.png';
  a.href=c.toDataURL('image/png');
  a.click();
  toast('已保存心愿卡截图');
}

/* ---- 地球NPC 装饰轮播（路牌 / LED / Slogan）---- */
let _earthTimers=[];
function startEarthCarousel(){
  _earthTimers.forEach(t=>clearInterval(t)); _earthTimers=[];
  // 路牌轮播
  const sign=document.getElementById('earthSign');
  if(sign) _earthTimers.push(setInterval(()=>{
    state.earthSignIdx=(state.earthSignIdx+1)%EARTH_SIGNS.length;
    sign.textContent=EARTH_SIGNS[state.earthSignIdx];
  },2600));
  // Slogan 轮播
  const slogan=document.getElementById('earthSlogan');
  if(slogan) _earthTimers.push(setInterval(()=>{
    state.earthSloganIdx=(state.earthSloganIdx+1)%EARTH_SLOGANS.length;
    slogan.textContent='「'+EARTH_SLOGANS[state.earthSloganIdx]+'」';
  },4500));
  // LED 跑马灯：CSS 动画循环切换文案
  const led=document.getElementById('earthLed');
  if(led){
    let li=0;
    _earthTimers.push(setInterval(()=>{ li=(li+1)%EARTH_LEDS.length; led.textContent=EARTH_LEDS[li]; },14000));
  }
}

// OAuth 回调分发（WorkBuddy 登录）
async function restoreAuth(){
  const url = new URL(location.href);
  if(!url.searchParams.has('code') && !url.searchParams.has('error')){
    return 'normal';
  }
  const provider = url.searchParams.get('provider');
  if(provider!=='workbuddy' && provider!=='wechat'){
    return 'error';
  }
  if(!cloud || typeof cloud.auth.handleWorkBuddyCallback!=='function'){
    return 'error';
  }
  try{
    const { data: session, error } = await cloud.auth.handleWorkBuddyCallback();
    if(error) return 'error';
    if(session){
      for(const key of ['code','state','provider']) url.searchParams.delete(key);
      history.replaceState(null,'',url.pathname+url.search+url.hash);
      _session = session;
      return 'ok';
    }
    return 'normal';
  }catch(e){ return 'error'; }
}

async function boot(){
  // 1. 恢复登录态
  const cb = await restoreAuth();
  if(cb==='normal'){
    await getSession();   // 尝试从本地恢复会话
  } else if(cb==='error'){
    toast('登录回调异常，请重新登录');
  }
  // 2. 拉取云端菜单（失败则用内置快照）
  await loadMenuFromCloud();
  // 3. 登录后恢复用户数据
  if(isLoggedIn()){
    await restoreFromCloud();
  }
  // 4. 渲染
  startCouponTimer();
  restoreCityBg();
  // 外部页（如健身页「选择派系」按钮）跳回时，直达「今天你是谁」派系选择页
  if(location.hash === '#faction' || location.hash === '#factions'){
    if(state.city && state.store){
      state.dineMode = 'single';
      renderFactionSelect();
    } else {
      renderWelcome();
    }
  } else {
    renderWelcome();
  }
  // 落叶加载动画收尾
  const ld = document.getElementById('leafLoader');
  if(ld){ ld.classList.add('done'); setTimeout(()=>ld.remove(), 500); }
}
boot();
