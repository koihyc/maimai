<meta charset="UTF-8">

<title>麦门信徒的点餐搭子</title>

<style>
@font-face {
  font-family: 'Zpix';
  src: url('https://cdn.jsdelivr.net/gh/SolidZORO/zpix-pixel-font@master/dist/Zpix.ttf') format('truetype');
  font-display: swap;
}
:root{
  --gold:#ffc107; --red:#da291c; --brown:#2b1506; --cream:#fff7e8;
  --blue:#2f6fd0; --green:#37a437; --orange:#f08c1a; --pink:#f26fa8;
  --px:4px solid var(--brown);
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:'Zpix','Press Start 2P','Microsoft YaHei',monospace;
  background:
    radial-gradient(circle at 20% 20%, #ffe9b0 0, transparent 40%),
    radial-gradient(circle at 80% 0%, #ffd9d9 0, transparent 45%),
    linear-gradient(160deg,#fff7e8 0%,#ffe3b8 55%,#ffd9c9 100%);
  color:var(--brown);
  min-height:100vh;
  image-rendering:pixelated;
  overflow-x:hidden;
}
body::before{
  content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
  background-image:
    linear-gradient(rgba(43,21,6,.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(43,21,6,.05) 1px, transparent 1px);
  background-size:24px 24px;
}
#app{position:relative; z-index:1; max-width:1080px; margin:0 auto; padding:20px;}

/* ---------- generic pixel components ---------- */
.px{background:#fff; border:var(--px); box-shadow:6px 6px 0 rgba(43,21,6,.25); border-radius:4px;}
.px-gold{background:linear-gradient(180deg,#ffd54f,#ffb300);}
.px-red{background:linear-gradient(180deg,#ff6b5e,#da291c); color:#fff;}
.px-green{background:linear-gradient(180deg,#6fce6f,#37a437); color:#fff;}
.px-blue{background:linear-gradient(180deg,#6fa7ff,#2f6fd0); color:#fff;}
.px-pink{background:linear-gradient(180deg,#ffa3c8,#f26fa8); color:#fff;}
.btn{
  display:inline-block; cursor:pointer; border:var(--px); box-shadow:4px 4px 0 var(--brown);
  padding:10px 16px; font:inherit; font-size:13px; color:var(--brown);
  background:#fff; user-select:none; transition:none; letter-spacing:1px;
}
.btn:active{transform:translate(4px,4px); box-shadow:0 0 0 var(--brown);}
.btn:disabled{opacity:.5; cursor:not-allowed;}
.btn-sm{padding:6px 10px; font-size:11px; box-shadow:3px 3px 0 var(--brown);}
.btn-sm:active{transform:translate(3px,3px); box-shadow:0 0 0 var(--brown);}
.btn.gold{background:linear-gradient(180deg,#ffd54f,#ffb300);}
.btn.red{background:linear-gradient(180deg,#ff6b5e,#da291c); color:#fff;}
.tag{display:inline-block; font-size:10px; padding:2px 6px; border:2px solid var(--brown); background:var(--cream); border-radius:2px;}
.title-px{
  font-family:'Press Start 2P','Zpix',monospace; letter-spacing:0;
  text-shadow:3px 3px 0 rgba(43,21,6,.18);
}
.chinese{font-family:'Zpix','Microsoft YaHei',monospace;}

/* ---------- header ---------- */
header.px{
  display:flex; align-items:center; gap:16px; padding:14px 18px; flex-wrap:wrap;
  background:linear-gradient(180deg,#fff,#ffeecb);
}
.logo-mark{
  width:46px;height:46px; background:var(--red); border:3px solid var(--brown);
  box-shadow:3px 3px 0 rgba(43,21,6,.3); border-radius:50%; position:relative; flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;color:var(--gold);
  font-size:22px; text-shadow:2px 2px 0 var(--brown);
}
.brand{flex:1; min-width:200px;}
.brand h1{font-size:16px; line-height:1.5;}
.brand .sub{font-size:11px; color:#8a5a2b; margin-top:4px; letter-spacing:2px;}
.faction-pill{display:flex; align-items:center; gap:8px; font-size:12px;}
.faction-pill canvas{image-rendering:pixelated; border:2px solid var(--brown); background:#fff; border-radius:3px;}

/* ---------- tabs ---------- */
nav.tabs{display:flex; gap:0; margin:18px 0 14px; flex-wrap:wrap;}
nav.tabs .btn{flex:1; min-width:130px; text-align:center; border-right:none; }
nav.tabs .btn:last-child{border-right:var(--px);}
nav.tabs .btn.active{background:var(--red); color:#fff;}
.subtabs{display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap;}
.subtabs .btn.active{background:var(--gold);}

/* ---------- layout ---------- */
.grid{display:grid; gap:16px;}
.cols-2{grid-template-columns:1fr 1fr;}
.cols-menu{grid-template-columns:1.15fr .85fr;}
@media(max-width:820px){.cols-2,.cols-menu{grid-template-columns:1fr;}}
.card{padding:16px;}
.card h2{font-size:14px; margin-bottom:12px; display:flex; align-items:center; gap:8px;}
.card h2 .bar{width:6px;height:18px;background:var(--red);box-shadow:2px 2px 0 rgba(0,0,0,.2);}

/* ---------- faction select screen ---------- */
.fs-title{text-align:center; margin:20px 0 6px; font-size:24px;}
.fs-sub{text-align:center; font-size:12px; color:#8a5a2b; margin-bottom:24px; letter-spacing:2px;}
.fs-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:18px;}
@media(max-width:820px){.fs-grid{grid-template-columns:repeat(2,1fr);}}
.faction-card{
  cursor:pointer; padding:18px 14px; text-align:center; position:relative;
  transition:transform .12s;
}
.faction-card:hover{transform:translate(-3px,-3px);}
.faction-card.selected{outline:4px solid var(--red); outline-offset:2px;}
.faction-card canvas{image-rendering:pixelated; width:96px;height:96px; border:3px solid var(--brown); background:#fff; border-radius:4px; box-shadow:4px 4px 0 rgba(0,0,0,.2);}
.faction-card h3{font-size:14px; margin:12px 0 4px;}
.faction-card .fc-sub{font-size:11px; color:#8a5a2b; margin-bottom:8px;}
.faction-card .tags{display:flex; flex-wrap:wrap; gap:4px; justify-content:center; margin-top:8px;}
.faction-card .start{margin-top:14px; font-size:11px; opacity:.9;}

/* ---------- menu / cart ---------- */
.menu-filters{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px;}
.menu-list{max-height:460px; overflow:auto; display:flex; flex-direction:column; gap:8px; padding-right:4px;}
.menu-item{display:flex; align-items:center; gap:10px; padding:9px 10px; border:3px solid var(--brown); background:#fff; box-shadow:3px 3px 0 rgba(43,21,6,.18); border-radius:3px;}
.menu-item .mi-info{flex:1; min-width:0;}
.menu-item .mi-name{font-size:12px; display:flex; gap:6px; align-items:center; flex-wrap:wrap;}
.menu-item .mi-meta{font-size:10px; color:#8a5a2b; margin-top:3px;}
.menu-item .mi-price{font-family:'Press Start 2P',monospace; font-size:12px; white-space:nowrap;}
.cart-item{display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:2px dashed #e6cfae; font-size:12px;}
.cart-item .ci-name{flex:1;}
.qty{display:inline-flex; align-items:center; gap:6px;}
.qty .btn{width:26px;height:26px; padding:0; line-height:1; font-size:14px;}
.result-box{margin-top:12px; padding:12px; border:3px dashed var(--brown); background:var(--cream); border-radius:3px; font-size:12px; line-height:1.9;}
.result-box .big{font-family:'Press Start 2P',monospace; font-size:16px; color:var(--red);}
.note-warn{background:#fff2d9; border:3px solid var(--orange); border-radius:3px; padding:8px 10px; margin-top:8px; font-size:11px;}

/* ---------- recommendation ---------- */
.rec-card{display:flex; gap:10px; align-items:center; padding:10px; border:3px solid var(--brown); background:#fff; border-radius:3px; box-shadow:3px 3px 0 rgba(43,21,6,.15); margin-bottom:8px;}
.rec-card .why{font-size:10px; color:#8a5a2b; margin-left:auto; white-space:nowrap;}
.check-row{display:flex; flex-wrap:wrap; gap:8px; margin:8px 0;}
.check-pill{cursor:pointer; font-size:11px; padding:5px 10px; border:3px solid var(--brown); background:#fff; border-radius:3px; user-select:none;}
.check-pill.on{background:var(--gold);}
.remark-out{margin-top:8px; font-size:12px; background:var(--cream); border:3px dashed var(--brown); padding:10px; border-radius:3px; word-break:break-all;}

/* ---------- mood ---------- */
.mood-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px;}
@media(max-width:640px){.mood-grid{grid-template-columns:1fr;}}
.mood-card{padding:14px;}
.mood-card .mood-emoji{font-size:26px; margin-bottom:6px;}
.mood-card h3{font-size:13px; margin-bottom:6px;}
.mood-card .mood-items{font-size:11px; color:#8a5a2b; line-height:1.8; margin-bottom:8px;}
.mood-card .quote{font-size:11px; color:var(--red); border-left:4px solid var(--gold); padding-left:8px; margin-bottom:10px; line-height:1.7;}

/* ---------- group ---------- */
.form-row{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:12px; align-items:center;}
.form-row label{font-size:12px;}
.form-row input,.form-row select{
  font:inherit; font-size:12px; padding:8px 10px; border:3px solid var(--brown); background:#fff; border-radius:3px; color:var(--brown);
}
.person-card{padding:12px; margin-bottom:12px; border:3px solid var(--brown); background:#fff; border-radius:3px; box-shadow:3px 3px 0 rgba(43,21,6,.15);}
.person-card .ph{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:8px;}
.person-card .ph input{width:110px;}
.person-card .ph select{flex:1; min-width:120px;}
.avoid-list{display:flex; flex-wrap:wrap; gap:6px;}
.bill-table{width:100%; border-collapse:collapse; font-size:12px; margin-top:10px;}
.bill-table th,.bill-table td{border:2px solid var(--brown); padding:6px 8px; text-align:left;}
.bill-table th{background:var(--gold);}
.bill-table td.num{text-align:right; font-family:'Press Start 2P',monospace; font-size:11px;}
.over{color:var(--red); font-weight:bold;}
.ok{color:var(--green); font-weight:bold;}

/* ---------- eggs ---------- */
.egg-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
@media(max-width:820px){.egg-grid{grid-template-columns:1fr;}}
.cal-row{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:2px dashed #e6cfae; font-size:12px;}
.cal-row .cal-dot{width:10px;height:10px;border:2px solid var(--brown); flex:0 0 auto;}
.cal-dot.hot{background:var(--red);}
.cal-dot.soon{background:var(--orange);}
.cal-dot.wait{background:#c9c9c9;}
.quote-stage{padding:20px; text-align:center; min-height:120px; display:flex; flex-direction:column; justify-content:center; gap:12px;}
.quote-stage .q-text{font-size:15px; line-height:1.8;}
.quote-stage .q-btn{align-self:center;}
.wish-card-wrap{text-align:center;}
#wishCanvas{image-rendering:pixelated; max-width:100%; border:4px solid var(--brown); box-shadow:6px 6px 0 rgba(43,21,6,.3); border-radius:4px;}

footer{text-align:center; font-size:10px; color:#8a5a2b; margin:26px 0 10px; letter-spacing:1px;}
.hidden{display:none !important;}
::selection{background:var(--gold);}
</style>

/* =========================================================
   优惠计算
   ========================================================= */
function computeBogo(cart){
  let save=0;
  cart.forEach(c=>{
    if(c.item.cat==='甜品'){ save += Math.floor(c.qty/2) * c.item.price * 0.5; }
  });
  return save;
}
function computeBest(cart, channel){
  const base = cartBase(cart);
  // 1+1
  const elig=[]; cart.forEach(c=>{ for(let i=0;i<c.qty;i++) if(c.item.oneplus) elig.push(c.item.price); });
  elig.sort((a,b)=>b-a);
  let opSave=0, opPairs=0;
  for(let i=0;i+1<elig.length;i+=2){ opSave += elig[i]+elig[i+1]-12.9; opPairs++; }
  const bogoSave = computeBogo(cart);
  let th={off:0,name:''};
  COUPONS.filter(c=>c.type==='threshold' && (!c.channel || c.channel===channel))
    .forEach(c=>{ if(base>=c.threshold && c.off>th.off) th={off:c.off,name:c.name}; });
  const opts=[
    {total: base-opSave-bogoSave, applied:[...(opPairs?[{name:'1+1随心配 12.9元',save:opSave}]:[]),...(bogoSave?[{name:'甜品第二份半价',save:bogoSave}]:[])]},
    {total: base-th.off-bogoSave, applied:[...(th.off?[{name:th.name,save:th.off}]:[]),...(bogoSave?[{name:'甜品第二份半价',save:bogoSave}]:[])]},
    {total: base-bogoSave, applied:[...(bogoSave?[{name:'甜品第二份半价',save:bogoSave}]:[])]},
  ];
  opts.sort((a,b)=>a.total-b.total);
  const best=opts[0];
  return {base, total:Math.max(0,best.total), savings:base-best.total, applied:best.applied};
}
function fillGap(cart, channel){
  const base=cartBase(cart); const cur=computeBest(cart,channel);
  const ths=COUPONS.filter(c=>c.type==='threshold' && (!c.channel||c.channel===channel))
    .map(c=>({t:c.threshold,off:c.off})).filter(o=>o.t>base).sort((a,b)=>a.t-b.t);
  for(const th of ths){
    const gap=th.t-base; if(gap>8) continue;
    const cand=MENU.filter(m=>m.price>=gap && m.price<th.off).sort((a,b)=>a.price-b.price);
    if(cand.length){
      const c=cand[0];
      return {item:c, add:c.price, threshold:th.t, off:th.off, netSave:th.off-c.price};
    }
  }
  return null;
}
function compareChannels(cart){
  const instore=computeBest(cart,'instore').total;
  const delivery=computeBest(cart,'delivery').total + 6 + 2; // 配送费6 包装费2
  return {instore, delivery, better: instore<=delivery?'instore':'delivery'};
}
function timeNotice(cart){
  const h=new Date().getHours();
  const isBreakfast = h>=5 && h<10.5;
  const hasBreakfast = cart.some(c=>c.item.cat==='早餐');
  const hasNormal = cart.some(c=>c.item.cat!=='早餐');
  const msgs=[];
  if(isBreakfast && hasNormal) msgs.push('当前是早餐时段(5:00-10:30)，部分正餐单品可能暂未供应，建议换成早餐选项。');
  if(!isBreakfast && hasBreakfast) msgs.push('早餐时段已过(10:30后)，早餐单品通常已下架。');
  if(hasBreakfast && hasNormal) msgs.push('注意：早餐与正餐单品通常不能同时下单，请分开下单。');
  return msgs;
}

const AVOID={辣:'辣',牛肉:'牛肉',鸡肉:'鸡肉',猪肉:'猪肉',鱼:'鱼',油炸:'油炸',乳:'乳'};
const AVOID_KEYS=Object.keys(AVOID);
function itemAllowed(item, avoids){
  for(const a of avoids){
    if(a==='素食'){ if(!item.tags.includes('素')) return false; continue; }
    if(item.tags.includes(AVOID[a])) return false;
  }
  return true;
}
const FACTION_MEAL={
  student:[['cheese',1],['corn',1]],
  fitness:[['chicken_board',1],['corn',1],['zero_cola',1]],
  food:[['bigmac',1],['fries_m',1]],
  heal:[['spicy_chicken',1],['mcflurry',1]],
};
function buildMeal(faction, avoids){
  const base=FACTION_MEAL[faction]||FACTION_MEAL.student;
  const result=[];
  base.forEach(([id,q])=>{
    let it=MENU_MAP[id];
    if(!itemAllowed(it,avoids)){
      const alt=MENU.filter(m=>m.cat===it.cat && m.id!==id && itemAllowed(m,avoids)).sort((a,b)=>a.price-b.price)[0];
      it=alt||null;
    }
    if(it){ const f=result.find(x=>x.item.id===it.id); if(f)f.qty+=q; else result.push({item:it,qty:q}); }
  });
  return result;
}
function buildGroupPlan(){
  const people=state.groupPeople.map(p=>({name:p.name||('信徒'+(state.groupPeople.indexOf(p)+1)), faction:p.faction, avoids:p.avoids||[]}));
  const all=people.map(p=>({...p, items:buildMeal(p.faction,p.avoids)}));
  // 预算控制：超预算时降级
  let total=0; all.forEach(p=>p.items.forEach(x=>total+=x.item.price*x.qty));
  let guard=0;
  while(total>state.groupBudget && guard++<200){
    let changed=false;
    // 找最贵单品并替换/移除
    let best=null;
    all.forEach(p=>p.items.forEach(x=>{ if(!best || x.item.price>best.x.item.price) best={p,x}; }));
    if(!best) break;
    const {p,x}=best;
    if(p.items.length>1){
      p.items=p.items.filter(it=>it!==x);
      changed=true;
    } else {
      const alt=MENU.filter(m=>m.cat===x.item.cat && m.price<x.item.price && itemAllowed(m,p.avoids)).sort((a,b)=>a.price-b.price)[0];
      if(alt){ x.item=alt; changed=true; }
      else break;
    }
    total=0; all.forEach(pp=>pp.items.forEach(xx=>total+=xx.item.price*xx.qty));
    if(!changed) break;
  }
  // 计算
  const combined=[]; all.forEach(p=>p.items.forEach(x=>{
    const f=combined.find(c=>c.item.id===x.item.id); if(f)f.qty+=x.qty; else combined.push({item:x.item,qty:x.qty});
  }));
  const best=computeBest(combined,'instore');
  const subs=all.map(p=>p.items.reduce((s,x)=>s+x.item.price*x.qty,0));
  const totalSub=subs.reduce((a,b)=>a+b,0)||1;
  const per=all.map((p,i)=>({...p, sub:subs[i], pay: subs[i]/totalSub*best.total}));
  return {all, combined, best, per, totalSub, grand:best.total, budget:state.groupBudget};
}

      `}

}

      <h2 class="chinese"><span class="bar"></span>DIY 自定义备注</h2>

        ${Object.keys(state.diy).map(k=>`
          <span class="check-pill chinese ${state.diy[k]?'on':''}" onclick="state.diy['${k}']=!state.diy['${k}'];renderTab()">${k}</span>`).join('')}

          <div>${sat.msg}</div>
        </div>`:'<div style="font-size:12px;color:#8a5a2b" class="chinese">先在「凑券·凑单」里加几件餐品，就能测算饱腹度啦。</div>'}

  </div>`;

function addCombo(){

  renderTab();
}

/* ---------------- 多人 ---------------- */
function renderGroup(){
  return `
  <div class="grid cols-2">
    <div class="card px">
      <h2 class="chinese"><span class="bar"></span>拼单信息录入</h2>
      <div class="form-row">
        <label class="chinese">人数</label>
        <input type="number" min="1" max="12" value="${state.groupCount}" onchange="changeGroupCount(this.value)">
        <label class="chinese">总预算</label>
        <input type="number" min="1" value="${state.groupBudget}" onchange="state.groupBudget=Number(this.value)">
      </div>
      <div id="peopleList">
        ${state.groupPeople.map((p,i)=>renderPersonCard(p,i)).join('')}
      </div>
    </div>
    <div class="card px">
      <h2 class="chinese"><span class="bar"></span>拼单方案</h2>
      <button class="btn gold chinese" onclick="generateGroup()">生成拼单方案</button>
      <div id="groupResult" style="margin-top:12px"></div>
    </div>
  </div>`;
}
function renderPersonCard(p,i){
  const avoidKeys=['辣','牛肉','鸡肉','猪肉','鱼','油炸','乳','素食'];
  return `
  <div class="person-card">
    <div class="ph">
      <input placeholder="昵称" value="${p.name}" oninput="state.groupPeople[${i}].name=this.value">
      <select onchange="state.groupPeople[${i}].faction=this.value">
        ${Object.entries(FACTIONS).map(([k,f])=>`<option value="${k}" ${p.faction===k?'selected':''}>${f.name}</option>`).join('')}
      </select>
    </div>
    <div style="font-size:11px;color:#8a5a2b;margin-bottom:6px" class="chinese">忌口（可多选）</div>
    <div class="avoid-list">
      ${avoidKeys.map(a=>`<span class="check-pill chinese ${(p.avoids||[]).includes(a)?'on':''}" onclick="toggleAvoid(${i},'${a}')">${a==='素食'?'素食':'不吃'+a}</span>`).join('')}
    </div>
  </div>`;
}
function changeGroupCount(v){
  v=Math.max(1,Math.min(12,Number(v)));
  state.groupCount=v;
  while(state.groupPeople.length<v){ state.groupPeople.push({name:'',faction:'student',avoids:[]}); }
  state.groupPeople.length=v;
  renderTab();
}
function toggleAvoid(i,a){
  const p=state.groupPeople[i]; if(!p) return;
  p.avoids=p.avoids||[];
  p.avoids=p.avoids.includes(a)?p.avoids.filter(x=>x!==a):p.avoids.concat(a);
  renderTab();
}
function generateGroup(){
  const plan=buildGroupPlan();
  const el=document.getElementById('groupResult');
  const over=plan.grand>plan.budget;
  el.innerHTML=`
    <div class="result-box chinese">
      <div>预算：${money(plan.budget)} &nbsp; 整单实付：<span class="big">${money(plan.grand)}</span>
        <span class="${over?'over':'ok'}">${over?'（超出预算 '+(plan.grand-plan.budget).toFixed(1)+' 元，已尽量压缩）':'（预算内 ✓）'}</span></div>
      ${plan.best.applied.length?plan.best.applied.map(a=>`<div>· 拼单凑满减：${a.name} -${money(a.save)}</div>`).join(''):'<div>· 未命中满减</div>'}
    </div>
    <table class="bill-table">
      <tr><th class="chinese">成员</th><th class="chinese">餐品</th><th class="num">小计</th><th class="num">分摊实付</th></tr>
      ${plan.per.map(p=>`
        <tr>
          <td class="chinese">${p.name}<br><span style="font-size:10px;color:#8a5a2b">${FACTIONS[p.faction].short}</span></td>
          <td class="chinese" style="font-size:11px">${p.items.map(x=>x.qty+'×'+x.item.name).join('<br>')||'—'}</td>
          <td class="num">${money(p.sub)}</td>
          <td class="num">${money(p.pay)}</td>
        </tr>`).join('')}
    </table>
    <div style="margin-top:10px;font-size:11px;color:#8a5a2b" class="chinese">已自动剔除忌口餐品并均衡预算，点击下方可批量备注。</div>
    <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-sm chinese" onclick="toast('已统一备注：全部饮料去冰、全部不要洋葱')">批量备注(去冰/去洋葱)</button>
      <button class="btn btn-sm chinese" onclick="copyBill()">复制AA账单</button>
    </div>`;
}
function copyBill(){
  const plan=buildGroupPlan();
  let t='麦门信徒拼单AA账单\n';
  plan.per.forEach(p=>{ t+=`${p.name}(${FACTIONS[p.faction].short}): ${p.items.map(x=>x.qty+'×'+x.item.name).join('、')} = ${money(p.pay)}\n`; });
  t+=`整单实付：${money(plan.grand)}（原价${money(plan.totalSub)}）`;
  copyText(t);
}

function renderEggs(){
  return `
  <div class="egg-grid">
    <div class="card px">
      <h2 class="chinese"><span class="bar"></span>联名限定日历</h2>
      ${LIMITED.map(l=>`
        <div class="cal-row">

          <div style="flex:1" class="chinese">
            <div style="font-size:12px">${l.name}</div>
            <div style="font-size:10px;color:#8a5a2b">${l.start} ~ ${l.end}</div>
          </div>
          <span class="chinese" style="font-size:10px">${l.status==='hot'?'热卖中':l.status==='soon'?'即将上线':'敬请期待'}</span>
        </div>`).join('')}
      <div style="font-size:10px;color:#8a5a2b;margin-top:8px" class="chinese">自动收录新品与联名上下线时间，不错过限定款。</div>
    </div>

    <div class="card px">
      <h2 class="chinese"><span class="bar"></span>信徒语录</h2>
      <div class="quote-stage">
        <div class="q-text chinese">「${QUOTES[state.moodQuote]}」</div>
        <button class="btn gold chinese q-btn" onclick="state.moodQuote=(state.moodQuote+1)%QUOTES.length;renderTab()">换一句</button>
      </div>
    </div>
  </div>

  <div class="card px" style="margin-top:16px">
    <h2 class="chinese"><span class="bar"></span>订单心愿卡</h2>
    <div class="wish-card-wrap">
      <canvas id="wishCanvas" width="460" height="600"></canvas>
      <div style="margin-top:12px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        <button class="btn gold chinese" onclick="drawWish()">生成/刷新心愿卡</button>
        <button class="btn red chinese" onclick="downloadWish()">保存截图</button>
      </div>
    </div>
  </div>`;
}
function drawWish(){
  const c=document.getElementById('wishCanvas'); if(!c) return;
  const ctx=c.getContext('2d'); ctx.imageSmoothingEnabled=false;
  const W=c.width,H=c.height;
  const f=FACTIONS[state.faction||'student'];
  const cart=cartWithItems();
  const best=cart.length?computeBest(cart,state.channel):{base:0,total:0,savings:0};
  // bg
  ctx.fillStyle='#fff7e8'; ctx.fillRect(0,0,W,H);
  // grid
  ctx.strokeStyle='rgba(43,21,6,.05)';
  for(let x=0;x<W;x+=20){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=20){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  // pixel border
  ctx.fillStyle='#2b1506';
  ctx.fillRect(0,0,W,8); ctx.fillRect(0,H-8,W,8); ctx.fillRect(0,0,8,H); ctx.fillRect(W-8,0,8,H);
  ctx.fillStyle='#ffc107';
  ctx.fillRect(8,8,W-16,8); ctx.fillRect(8,H-16,W-16,8); ctx.fillRect(8,8,8,H-16); ctx.fillRect(W-16,8,8,H-16);
  // avatar
  const av=renderAvatar(SPR[state.faction||'student'],8);
  ctx.drawImage(av, W/2-40, 44, 80, 80);
  // title
  ctx.fillStyle='#da291c'; ctx.font='20px "Press Start 2P", monospace'; ctx.textAlign='center';
  ctx.fillText('MC ORDER', W/2, 168);
  ctx.fillStyle='#2b1506'; ctx.font='bold 18px "Microsoft YaHei", monospace';
  ctx.fillText('麦门信徒 · 心愿卡', W/2, 198);
  ctx.fillStyle='#8a5a2b'; ctx.font='13px "Microsoft YaHei", monospace';
  ctx.fillText(f.name+' ｜ '+(new Date().toLocaleDateString('zh-CN')), W/2, 224);
  // divider
  ctx.fillStyle='#2b1506'; ctx.fillRect(40, 240, W-80, 4);
  // items
  ctx.textAlign='left'; ctx.fillStyle='#2b1506'; ctx.font='13px "Microsoft YaHei", monospace';
  let y=270;
  if(cart.length){
    cart.forEach(c=>{
      ctx.fillText(c.item.name+' ×'+c.qty, 48, y);
      ctx.textAlign='right'; ctx.fillText(money(c.item.price*c.qty), W-48, y); ctx.textAlign='left';
      y+=26;
    });
  } else {
    ctx.fillText('（还没有点餐，先去选几件吧）', 48, y); y+=26;
  }
  // total
  ctx.fillStyle='#2b1506'; ctx.fillRect(40, y, W-80, 4); y+=34;
  ctx.font='bold 16px "Microsoft YaHei", monospace';
  ctx.fillText('合计', 48, y); ctx.textAlign='right'; ctx.fillText(money(best.total), W-48, y); ctx.textAlign='left';
  if(best.savings>0){ y+=24; ctx.font='12px "Microsoft YaHei", monospace'; ctx.fillStyle='#37a437'; ctx.fillText('已省 '+money(best.savings), 48, y); }
  // quote
  y+=40; ctx.fillStyle='#da291c'; ctx.font='12px "Microsoft YaHei", monospace'; ctx.textAlign='center';
  wrapText(ctx, f.quote, W/2, y, W-80, 22);
  // footer
  ctx.fillStyle='#8a5a2b'; ctx.font='11px "Microsoft YaHei", monospace'; ctx.textAlign='center';
  ctx.fillText('★ 麦门永存 · 快乐至上 ★', W/2, H-30);
}
function wrapText(ctx,text,cx,y,maxW,lh){
  let line='', yy=y;
  for(const ch of text){
    if(ctx.measureText(line+ch).width>maxW){ ctx.fillText(line,cx,yy); line=ch; yy+=lh; }
    else line+=ch;
  }
  if(line) ctx.fillText(line,cx,yy);
}
function downloadWish(){
  drawWish();
  const c=document.getElementById('wishCanvas');
  const a=document.createElement('a');
  a.download='麦门信徒心愿卡.png';
  a.href=c.toDataURL('image/png');
  a.click();
  toast('已保存心愿卡截图');
}
function goWish(){ state.tab='eggs'; renderApp(); setTimeout(drawWish,50); }

function bindEggs(){

}
